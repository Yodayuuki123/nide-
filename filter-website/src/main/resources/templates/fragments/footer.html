<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<footer th:fragment="footer" class="bf-footer">
    <!-- Footer Main Content -->
    <div class="bf-footer-main">
        <div class="bf-container">
            <div class="bf-footer-grid-3col">
                <!-- Column 1: Send A Message Form -->
                <div class="bf-footer-col">
                    <h3 class="bf-footer-heading"><span class="bf-heading-bar"></span> <span th:text="#{footer.send_message}">Send A Message</span></h3>
                    <form th:action="@{/contact}" method="post" class="bf-footer-form">
                        <input type="text" name="name" th:placeholder="#{footer.form.name}" required>
                        <input type="email" name="email" th:placeholder="#{footer.form.email}" required>
                        <input type="tel" name="phone" th:placeholder="#{footer.form.tel}">
                        <input type="text" name="company" th:placeholder="#{footer.form.country}">
                        <textarea name="message" th:placeholder="#{footer.form.message}" rows="5" required></textarea>
                        <div class="bf-footer-file-row">
                            <input type="file" name="attachment">
                        </div>
                        <button type="submit" class="bf-footer-submit" th:text="#{footer.form.submit}">SUBMIT</button>
                    </form>
                </div>

                <!-- Column 2: Contact Information -->
                <div class="bf-footer-col">
                    <h3 class="bf-footer-heading"><span class="bf-heading-bar"></span> <span th:text="#{footer.contact_info}">Contact Information</span></h3>
                    <div class="bf-contact-items">
                        <!-- Email -->
                        <div class="bf-contact-item">
                            <div class="bf-contact-icon bf-icon-email">
                                <i class="bi bi-envelope-fill"></i>
                            </div>
                            <div class="bf-contact-text">
                                <span class="bf-contact-label">Email:</span>
                                <a href="mailto:belinda@philitee.com">belinda@philitee.com</a>
                            </div>
                        </div>

                        <!-- WhatsApp -->
                        <div class="bf-contact-item">
                            <div class="bf-contact-icon bf-icon-whatsapp">
                                <i class="bi bi-whatsapp"></i>
                            </div>
                            <div class="bf-contact-text">
                                <span class="bf-contact-label">WhatsApp:</span>
                                <a href="https://wa.me/8613636563667" target="_blank">+8613636563667</a>
                            </div>
                        </div>

                        <!-- WeChat -->
                        <div class="bf-contact-item">
                            <div class="bf-contact-icon bf-icon-wechat">
                                <i class="bi bi-wechat"></i>
                            </div>
                            <div class="bf-contact-text">
                                <span class="bf-contact-label">WeChat:</span>
                                <a th:href="@{/contact}">Scan QR Code</a>
                            </div>
                        </div>
                    </div>

                    <!-- Follow Us -->
                    <h3 class="bf-footer-heading" style="margin-top:30px;"><span class="bf-heading-bar"></span> <span th:text="#{footer.follow_us}">Follow Us</span></h3>
                    <div class="bf-social-icons">
                        <a href="#" target="_blank" class="bf-social-icon bf-social-facebook" title="Facebook"><i class="bi bi-facebook"></i></a>
                        <a href="#" target="_blank" class="bf-social-icon bf-social-linkedin" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
                        <a href="https://www.youtube.com/@ShanghaiPhiliteFiltration" target="_blank" class="bf-social-icon bf-social-youtube" title="YouTube"><i class="bi bi-youtube"></i></a>
                        <a href="https://wa.me/8613636563667" target="_blank" class="bf-social-icon bf-social-whatsapp" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
                        <a href="https://filterphilite.en.alibaba.com/" target="_blank" class="bf-social-icon bf-social-alibaba" title="Alibaba"><i class="bi bi-shop"></i></a>
                    </div>
                </div>
                <!-- Column 3: Useful Links (vertical) -->
                <div class="bf-footer-col">
                    <h3 class="bf-footer-heading"><span class="bf-heading-bar"></span> <span th:text="#{footer.useful_links}">Useful Links</span></h3>
                    <ul class="bf-useful-links-vertical">
                        <li><a th:href="@{/}" th:text="#{nav.home}">Home</a></li>
                        <li><a th:href="@{/products}" th:text="#{nav.products}">Products</a></li>
                        <li><a th:href="@{/solutions}" th:text="#{nav.solutions}">Solutions</a></li>
                        <li><a th:href="@{/about}" th:text="#{nav.about}">About Us</a></li>
                        <li><a th:href="@{/news}" th:text="#{nav.news}">News</a></li>
                        <li><a th:href="@{/contact}" th:text="#{nav.contact}">Contact</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Bottom -->
    <div class="bf-footer-bottom">
        <p>Copyright - <span th:text="#{site.name}">Philitee Filter</span>&reg;</p>
    </div>

    <!-- Floating Contact Buttons (right side) -->
    <div class="bf-floating-buttons">
        <a href="mailto:belinda@philitee.com" class="bf-float-btn bf-float-email" title="Email">
            <i class="bi bi-envelope-fill"></i>
        </a>
        <a href="https://wa.me/8613636563667" target="_blank" class="bf-float-btn bf-float-whatsapp" title="WhatsApp">
            <i class="bi bi-whatsapp"></i>
        </a>
    </div>
</footer>

</html>
