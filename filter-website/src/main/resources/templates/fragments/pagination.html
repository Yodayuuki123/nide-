<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Pagination Fragment (Aesop-style: clean, minimal) -->
<div th:fragment="pagination(pageData, baseUrl)" class="pagination-wrapper" th:if="${pageData != null and pageData.pages > 1}">
    <div class="pagination-inner">
        <!-- Page Info -->
        <div class="pagination-info">
            <span th:text="#{pagination.showing}">Showing</span>
            <span th:text="${(pageData.current - 1) * pageData.size + 1}">1</span>&ndash;<span th:text="${pageData.current * pageData.size > pageData.total ? pageData.total : pageData.current * pageData.size}">12</span>
            <span th:text="#{pagination.of}">of</span>
            <span th:text="${pageData.total}">100</span>
            <span th:text="#{pagination.products}">products</span>
        </div>

        <!-- Pagination Nav -->
        <nav class="pagination-nav">
            <!-- Previous -->
            <a class="pagination-btn pagination-prev"
               th:if="${pageData.current > 1}"
               th:href="@{${baseUrl}(page=${pageData.current - 1}, size=${pageData.size})}">
                <i class="bi bi-arrow-left"></i>
                <span th:text="#{pagination.previous}">Previous</span>
            </a>
            <span class="pagination-btn pagination-prev disabled" th:if="${pageData.current <= 1}">
                <i class="bi bi-arrow-left"></i>
                <span th:text="#{pagination.previous}">Previous</span>
            </span>

            <!-- Page Numbers -->
            <div class="pagination-numbers">
                <th:block th:with="startPage=${pageData.current - 2 > 0 ? pageData.current - 2 : 1},
                                   endPage=${pageData.current + 2 < pageData.pages ? pageData.current + 2 : pageData.pages}">

                    <!-- First page + ellipsis -->
                    <a class="pagination-num" th:if="${startPage > 1}"
                       th:href="@{${baseUrl}(page=1, size=${pageData.size})}">1</a>
                    <span class="pagination-ellipsis" th:if="${startPage > 2}">&hellip;</span>

                    <!-- Page range -->
                    <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                        <a class="pagination-num" th:classappend="${i == pageData.current} ? ' active'"
                           th:href="@{${baseUrl}(page=${i}, size=${pageData.size})}"
                           th:text="${i}">1</a>
                    </th:block>

                    <!-- Last page + ellipsis -->
                    <span class="pagination-ellipsis" th:if="${endPage < pageData.pages - 1}">&hellip;</span>
                    <a class="pagination-num" th:if="${endPage < pageData.pages}"
                       th:href="@{${baseUrl}(page=${pageData.pages}, size=${pageData.size})}"
                       th:text="${pageData.pages}">99</a>
                </th:block>
            </div>

            <!-- Next -->
            <a class="pagination-btn pagination-next"
               th:if="${pageData.current < pageData.pages}"
               th:href="@{${baseUrl}(page=${pageData.current + 1}, size=${pageData.size})}">
                <span th:text="#{pagination.next}">Next</span>
                <i class="bi bi-arrow-right"></i>
            </a>
            <span class="pagination-btn pagination-next disabled" th:if="${pageData.current >= pageData.pages}">
                <span th:text="#{pagination.next}">Next</span>
                <i class="bi bi-arrow-right"></i>
            </span>
        </nav>

        <!-- Per Page Selector -->
        <div class="pagination-per-page">
            <span th:text="#{pagination.per_page}">Per Page</span>
            <select onchange="window.location.href=this.value">
                <option th:each="s : ${ {12, 24, 48} }"
                        th:value="@{${baseUrl}(page=1, size=${s})}"
                        th:text="${s}"
                        th:selected="${s == pageData.size}">12</option>
            </select>
        </div>
    </div>
</div>

</html>
