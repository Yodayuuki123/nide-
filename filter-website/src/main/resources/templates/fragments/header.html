<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ===== HTML Head Fragment ===== -->
<head th:fragment="htmlHead(pageTitle, pageDescription)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO Meta Tags -->
    <title th:text="${pageTitle} ? ${pageTitle} + ' | ' + #{site.name} : #{site.name} + ' - ' + #{site.title}">Philitee Filter</title>
    <meta name="description" th:content="${pageDescription} ?: #{site.description}">
    <meta name="keywords" th:content="${pageKeywords} ?: 'industrial filter bags, filter cloth, filter cartridge, dust collector bags'">

    <!-- Open Graph -->
    <meta property="og:title" th:content="${pageTitle} ?: #{site.name}">
    <meta property="og:description" th:content="${pageDescription} ?: #{site.description}">
    <meta property="og:type" content="website">
    <meta property="og:image" th:content="${ogImage} ?: '/static/images/og-default.jpg'">

    <!-- Hreflang -->
    <link rel="alternate" hreflang="en" th:href="@{/(lang='en')}">
    <link rel="alternate" hreflang="zh-CN" th:href="@{/(lang='zh_CN')}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<!-- ===== Navbar Fragment ===== -->
<nav th:fragment="navbar" class="navbar-wrapper">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="top-bar-left d-none d-md-flex align-items-center gap-4">
                <span><i class="bi bi-envelope"></i> info@philitee.com</span>
                <span><i class="bi bi-telephone"></i> +86-XXX-XXXX-XXXX</span>
                <span><i class="bi bi-whatsapp"></i> WhatsApp</span>
            </div>
            <div class="top-bar-right d-flex align-items-center gap-3">
                <div class="lang-switcher">
                    <a th:href="@{${currentUri}(lang='en')}"
                       th:classappend="${#locale.language == 'en'} ? 'active' : ''">EN</a>
                    <span>|</span>
                    <a th:href="@{${currentUri}(lang='zh_CN')}"
                       th:classappend="${#locale.language == 'zh'} ? 'active' : ''">中文</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" th:href="@{/}">
                <img src="/static/images/logo.png" alt="Philitee Filter" class="logo-img"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
                <span class="logo-text" style="display:none" th:text="#{site.name}">Philitee Filter</span>
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Nav Items -->
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"
                           th:classappend="${currentUri == '/'} ? ' active' : ''"
                           th:text="#{nav.home}">Home</a>
                    </li>

                    <!-- Products Dropdown with Category Tree -->
                    <li class="nav-item dropdown mega-dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false"
                           th:classappend="${#strings.startsWith(currentUri, '/products') or #strings.startsWith(currentUri, '/categories')} ? ' active' : ''"
                           th:text="#{nav.products}">Products</a>
                        <div class="dropdown-menu mega-menu">
                            <div class="container">
                                <div class="row" th:if="${globalCategoryTree != null}">
                                    <div class="col-md-4 col-lg-3 mega-col"
                                         th:each="cat,iter : ${globalCategoryTree}"
                                         th:if="${iter.index < 8}">
                                        <a class="mega-category-title" th:href="@{/categories/{slug}(slug=${cat.slug})}"
                                           th:text="${cat.name}">Category</a>
                                        <ul class="mega-sub-list" th:if="${cat.children != null and !cat.children.isEmpty()}">
                                            <li th:each="child : ${cat.children}">
                                                <a th:href="@{/categories/{slug}(slug=${child.slug})}"
                                                   th:text="${child.name}">Sub Category</a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                                <div class="mega-footer">
                                    <a th:href="@{/products}" class="btn btn-outline-primary btn-sm"
                                       th:text="#{home.hero.cta}">View All Products</a>
                                </div>
                            </div>
                        </div>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}"
                           th:classappend="${currentUri == '/about'} ? ' active' : ''"
                           th:text="#{nav.about}">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/factory}"
                           th:classappend="${currentUri == '/factory'} ? ' active' : ''"
                           th:text="#{nav.factory}">Our Factory</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contact}"
                           th:classappend="${currentUri == '/contact'} ? ' active' : ''"
                           th:text="#{nav.contact}">Contact Us</a>
                    </li>

                    <!-- Search Button -->
                    <li class="nav-item ms-lg-3">
                        <button class="btn btn-outline-primary btn-sm" type="button"
                                data-bs-toggle="collapse" data-bs-target="#searchBar">
                            <i class="bi bi-search"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Search Bar (collapsible) -->
    <div class="collapse search-bar-collapse" id="searchBar">
        <div class="container py-3">
            <form th:action="@{/search}" method="get" class="d-flex gap-2">
                <input type="text" name="keyword" class="form-control"
                       th:placeholder="#{search.placeholder}" required>
                <button type="submit" class="btn btn-primary" th:text="#{search.button}">Search</button>
            </form>
        </div>
    </div>
</nav>

</html>
