<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== Admin HTML Head ===== -->
<head th:fragment="adminHead(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - ' + #{admin.title}">Admin Panel</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Admin CSS -->
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<!-- ===== Admin Sidebar ===== -->
<div th:fragment="adminSidebar" class="admin-sidebar">
    <div class="admin-sidebar-header">
        <a href="/admin/dashboard" class="admin-logo">
            <i class="bi bi-filter-circle-fill"></i>
            <span>Philitee Admin</span>
        </a>
    </div>

    <nav class="admin-nav">
        <ul>
            <li th:classappend="${currentUri == '/admin/dashboard'} ? 'active'">
                <a href="/admin/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span th:text="#{admin.dashboard}">Dashboard</span>
                </a>
            </li>

            <!-- 内容管理分组 -->
            <li class="nav-section-title">内容管理</li>

            <li th:classappend="${#strings.startsWith(currentUri, '/admin/products')} ? 'active'">
                <a href="/admin/products">
                    <i class="bi bi-box-seam"></i>
                    <span th:text="#{admin.products}">Products</span>
                </a>
            </li>
            <li th:classappend="${#strings.startsWith(currentUri, '/admin/categories')} ? 'active'">
                <a href="/admin/categories">
                    <i class="bi bi-folder2"></i>
                    <span th:text="#{admin.categories}">Categories</span>
                </a>
            </li>
            <li th:classappend="${#strings.startsWith(currentUri, '/admin/images')} ? 'active'">
                <a href="/admin/images">
                    <i class="bi bi-image"></i>
                    <span th:text="#{admin.images}">Images</span>
                </a>
            </li>
            <li th:classappend="${#strings.startsWith(currentUri, '/admin/menus')} ? 'active'">
                <a href="/admin/menus">
                    <i class="bi bi-list-nested"></i>
                    <span th:text="#{admin.menus}">Menus</span>
                </a>
            </li>
            <li th:classappend="${#strings.startsWith(currentUri, '/admin/inquiries')} ? 'active'">
                <a href="/admin/inquiries">
                    <i class="bi bi-chat-dots"></i>
                    <span>Inquiries</span>
                </a>
            </li>

            <!-- 系统管理分组 - 仅管理员可见 -->
            <li class="nav-section-title" sec:authorize="hasRole('ADMIN')">系统管理</li>

            <li sec:authorize="hasRole('ADMIN')"
                th:classappend="${#strings.startsWith(currentUri, '/admin/users')} ? 'active'">
                <a href="/admin/users">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')"
                th:classappend="${#strings.startsWith(currentUri, '/admin/roles')} ? 'active'">
                <a href="/admin/roles">
                    <i class="bi bi-shield-lock"></i>
                    <span>角色权限</span>
                </a>
            </li>
            <li sec:authorize="hasAnyAuthority('setting:view', 'setting:edit')"
                th:classappend="${#strings.startsWith(currentUri, '/admin/settings')} ? 'active'">
                <a href="/admin/settings">
                    <i class="bi bi-gear"></i>
                    <span>网站设置</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="admin-sidebar-footer">
        <a href="/" target="_blank" class="btn btn-outline-light btn-sm w-100 mb-2">
            <i class="bi bi-eye"></i> View Site
        </a>
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                <i class="bi bi-box-arrow-right"></i>
                <span th:text="#{admin.logout}">Logout</span>
            </button>
        </form>
    </div>
</div>

<!-- ===== Admin Topbar ===== -->
<div th:fragment="adminTopbar" class="admin-topbar">
    <div class="d-flex justify-content-between align-items-center">
        <button class="btn btn-link admin-sidebar-toggle d-lg-none" type="button" onclick="document.body.classList.toggle('sidebar-open')">
            <i class="bi bi-list fs-4"></i>
        </button>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-muted">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name">Admin</span>
            </span>
        </div>
    </div>
</div>

<!-- ===== Admin Scripts ===== -->
<div th:fragment="adminScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin.js"></script>
</div>

</html>
