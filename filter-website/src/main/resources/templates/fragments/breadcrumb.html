<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Breadcrumb Fragment -->
<div th:fragment="breadcrumb(items)" class="bf-breadcrumb">
    <div class="bf-container">
        <ol class="bf-breadcrumb-list">
            <li>
                <a th:href="@{/}"><i class="bi bi-house-door-fill"></i> Home</a>
            </li>
            <th:block th:each="item,stat : ${items}">
                <li>
                    <span class="bf-breadcrumb-sep">/</span>
                    <a th:if="${!stat.last and item.url != null}"
                       th:href="${item.url}"
                       th:text="${item.label}">Link</a>
                    <span th:if="${stat.last or item.url == null}"
                          th:text="${item.label}">Current</span>
                </li>
            </th:block>
        </ol>
    </div>
</div>
</html>
