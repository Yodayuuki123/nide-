<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('用户管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>
    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">用户管理</h4>
                </div>
                <a href="/admin/users/add" class="btn btn-primary btn-sm"><i class="bi bi-plus-circle"></i> 新增用户</a>
            </div>

            <div class="admin-card mb-3">
                <div class="admin-card-body">
                    <form method="get" th:action="@{/admin/users}" class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label form-label-sm">关键词</label>
                            <input type="text" name="keyword" th:value="${param.keyword}" class="form-control form-control-sm" placeholder="搜索用户名、姓名、邮箱...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">每页显示</label>
                            <select name="size" class="form-select form-select-sm">
                                <option value="10" th:selected="${userPage.size == 10}">10</option>
                                <option value="20" th:selected="${userPage.size == 20}">20</option>
                                <option value="50" th:selected="${userPage.size == 50}">50</option>
                                <option value="100" th:selected="${userPage.size == 100}">100</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> 搜索</button>
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> 重置</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-card">
                <div class="admin-card-header"><h5 class="mb-0">全部用户</h5></div>
                <div class="admin-card-body">
                    <table class="table admin-table mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>姓名</th>
                            <th>邮箱</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>更新时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${userPage.records}">
                            <td th:text="${user.id}">1</td>
                            <td><strong th:text="${user.username}">admin</strong></td>
                            <td th:text="${user.realName} ?: '-'">-</td>
                            <td th:text="${user.email} ?: '-'">-</td>
                            <td>
                                <span th:each="role : ${user.roles}" class="badge bg-primary me-1" th:text="${role.displayName}">Admin</span>
                                <span th:if="${user.roles == null or user.roles.isEmpty()}" class="text-muted">无</span>
                            </td>
                            <td>
                                <span th:if="${user.status == 1}" class="badge bg-success">启用</span>
                                <span th:if="${user.status == 0}" class="badge bg-secondary">禁用</span>
                            </td>
                            <td class="text-muted" th:text="${user.updatedAt != null ? #temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm') : (user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '-')}">2026-01-01</td>
                            <td class="actions">
                                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-outline-primary btn-sm" title="编辑"><i class="bi bi-pencil"></i></a>
                                <form th:if="${user.username != 'admin'}" th:action="@{/admin/users/toggle-status/{id}(id=${user.id})}" method="post" style="display:inline">
                                    <button type="submit" class="btn btn-outline-warning btn-sm" th:title="${user.status == 1 ? '禁用' : '启用'}"><i th:class="${user.status == 1 ? 'bi bi-toggle-on' : 'bi bi-toggle-off'}"></i></button>
                                </form>
                                <button th:if="${user.username != 'admin'}" type="button" class="btn btn-outline-danger btn-sm" th:data-id="${user.id}" th:data-name="${user.username}" onclick="confirmDelete(this)"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr th:if="${userPage.records.isEmpty()}"><td colspan="8" class="text-center text-muted py-4">暂无用户数据。</td></tr>
                        </tbody>
                    </table>

                    <div class="p-3 d-flex justify-content-between align-items-center" th:if="${userPage.pages > 1}">
                        <span></span>
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${userPage.current <= 1} ? 'disabled'"><a class="page-link" th:href="@{/admin/users(page=${userPage.current - 1}, size=${userPage.size}, keyword=${param.keyword})}">上一页</a></li>
                                <th:block th:with="startPage=${userPage.current - 2 > 1 ? userPage.current - 2 : 1}, endPage=${userPage.pages < (userPage.current - 2 > 1 ? userPage.current - 2 : 1) + 4 ? userPage.pages : (userPage.current - 2 > 1 ? userPage.current - 2 : 1) + 4}">
                                    <li th:if="${startPage > 1}" class="page-item"><a class="page-link" th:href="@{/admin/users(page=1, size=${userPage.size}, keyword=${param.keyword})}">1</a></li>
                                    <li th:if="${startPage > 2}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                                        <li class="page-item" th:classappend="${i == userPage.current} ? 'active'"><a class="page-link" th:href="@{/admin/users(page=${i}, size=${userPage.size}, keyword=${param.keyword})}" th:text="${i}">1</a></li>
                                    </th:block>
                                    <li th:if="${endPage < userPage.pages - 1}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <li th:if="${endPage < userPage.pages}" class="page-item"><a class="page-link" th:href="@{/admin/users(page=${userPage.pages}, size=${userPage.size}, keyword=${param.keyword})}" th:text="${userPage.pages}">99</a></li>
                                </th:block>
                                <li class="page-item" th:classappend="${userPage.current >= userPage.pages} ? 'disabled'"><a class="page-link" th:href="@{/admin/users(page=${userPage.current + 1}, size=${userPage.size}, keyword=${param.keyword})}">下一页</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center py-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 2.5rem;"></i>
                <p class="mt-3 mb-1">确认删除此用户？</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer justify-content-center border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <form id="deleteForm" method="post" class="d-inline"><button type="submit" class="btn btn-danger btn-sm">确认删除</button></form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
function confirmDelete(btn) {
    document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/users/delete/' + btn.getAttribute('data-id');
    bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteModal')).show();
}
</script>
</body>
</html>
