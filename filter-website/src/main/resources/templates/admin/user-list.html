<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('用户管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash 留言内容s -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">用户管理</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">管理管理员账号和权限</p>
                </div>
                <a href="/admin/users/add" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> 新增用户
                </a>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>全部用户</h5>
                </div>
                <div class="admin-card-body">
                    <table class="table admin-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>真实姓名</th>
                            <th>邮箱</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>最后登录</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${userPage.records}">
                            <td th:text="${user.id}">1</td>
                            <td>
                                <strong th:text="${user.username}">admin</strong>
                            </td>
                            <td th:text="${user.realName ?: '-'}">Admin</td>
                            <td th:text="${user.email ?: '-'}">admin@example.com</td>
                            <td>
                                <span th:each="role,iter : ${user.roles}"
                                      class="badge bg-primary me-1" th:text="${role.displayName}">Admin</span>
                                <span th:if="${user.roles == null or user.roles.isEmpty()}" class="text-muted">未分配</span>
                            </td>
                            <td>
                                <span th:if="${user.status == 1}" class="badge bg-success">启用</span>
                                <span th:if="${user.status == 0}" class="badge bg-secondary">禁用</span>
                            </td>
                            <td>
                                <small th:text="${user.lastLoginTime != null ? #temporals.format(user.lastLoginTime, 'yyyy-MM-dd HH:mm') : '-'}">2026-01-01</small>
                            </td>
                            <td class="actions">
                                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                                   class="btn btn-outline-primary btn-sm" title="编辑">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:if="${user.username != 'admin'}" th:action="@{/admin/users/toggle-status/{id}(id=${user.id})}"
                                      method="post" style="display:inline">
                                    <button type="submit" class="btn btn-outline-warning btn-sm"
                                            th:title="${user.status == 1 ? '禁用' : '启用'}">
                                        <i th:class="${user.status == 1 ? 'bi bi-toggle-on' : 'bi bi-toggle-off'}"></i>
                                    </button>
                                </form>
                                <form th:if="${user.username != 'admin'}" th:action="@{/admin/users/delete/{id}(id=${user.id})}"
                                      method="post" style="display:inline"
                                      onsubmit="return confirm('确定要删除该用户吗？')">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="删除">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${userPage.records.isEmpty()}">
                            <td colspan="8" class="text-center text-muted py-4">暂无用户数据</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${userPage.pages > 1}" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${userPage.current == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${userPage.current - 1})}">上一页</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(1, userPage.pages)}" class="page-item"
                        th:classappend="${i == userPage.current} ? 'active'">
                        <a class="page-link" th:href="@{/admin/users(page=${i})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${userPage.current == userPage.pages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${userPage.current + 1})}">下一页</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
