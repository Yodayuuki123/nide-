<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('鏍囩绠＄悊')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash messages -->

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">鏍囩绠＄悊</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">Organize your products with tags</p>
                </div>
                <a href="/admin/tags/add" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> <span th:text="#{admin.add}">鏂板</span>
                </a>
            </div>

            <!-- Search Form -->
            <div class="admin-card mb-3">
                <div class="admin-card-body">
                    <form method="get" th:action="@{/admin/tags}" class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label form-label-sm">鏍囩鍚嶇О</label>
                            <input type="text" name="keyword" th:value="${param.keyword}" class="form-control form-control-sm" placeholder="鎼滅储鏍囩鍚嶇О...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">淇敼鏃堕棿璧?/label>
                            <input type="date" name="startDate" th:value="${param.startDate}" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">淇敼鏃堕棿姝?/label>
                            <input type="date" name="endDate" th:value="${param.endDate}" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">姣忛〉鏄剧ず</label>
                            <select name="size" class="form-select form-select-sm">
                                <option value="10" th:selected="${tagPage.size == 10}">10</option>
                                <option value="20" th:selected="${tagPage.size == 20}">20</option>
                                <option value="50" th:selected="${tagPage.size == 50}">50</option>
                                <option value="100" th:selected="${tagPage.size == 100}">100</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> 鎼滅储</button>
                            <a th:href="@{/admin/tags}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> 閲嶇疆</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>鍏ㄩ儴鏍囩</h5>
                    <span class="text-muted" th:text="'鍏?' + ${tagPage.total} + ' 鏉?"></span>
                </div>
                <div class="admin-card-body">
                    <div class="table-responsive">
                        <table class="table admin-table mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>鍚嶇О</th>
                                <th>URL鍒悕</th>
                                <th>淇敼鏃堕棿</th>
                                <th th:text="#{admin.actions}">鎿嶄綔</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="tag : ${tagPage.records}">
                                <td th:text="${tag.id}">1</td>
                                <td>
                                    <strong>
                                        <i class="bi bi-tag text-primary me-1"></i>
                                        <span th:text="${tag.name}">Tag</span>
                                    </strong>
                                </td>
                                <td class="text-muted" th:text="${tag.slug}">slug</td>
                                <td class="text-muted" th:text="${tag.updatedTime != null} ? ${#temporals.format(tag.updatedTime, 'yyyy-MM-dd HH:mm')} : (${tag.createdTime != null} ? ${#temporals.format(tag.createdTime, 'yyyy-MM-dd HH:mm')} : '-')">2026-01-01</td>
                                <td class="actions">
                                    <a th:href="@{/admin/tags/edit/{id}(id=${tag.id})}"
                                       class="btn btn-sm btn-outline-primary me-1" title="缂栬緫">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:data-id="${tag.id}"
                                            th:data-name="${tag.name}"
                                            onclick="confirmDelete(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${tagPage.records == null or tagPage.records.isEmpty()}">
                                <td colspan="5" class="text-center text-muted py-4">鏆傛棤鏍囩鏁版嵁銆?/td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-3 d-flex justify-content-between align-items-center" th:if="${tagPage.pages > 1}">
                        <span class="text-muted" style="font-size:13px;" th:text="'鏄剧ず ' + ${(tagPage.current - 1) * tagPage.size + 1} + '-' + ${T(java.lang.Math).min(tagPage.current * tagPage.size, tagPage.total)} + ' / 鍏?' + ${tagPage.total} + ' 鏉?"></span>
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${tagPage.current <= 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/tags(page=${tagPage.current - 1}, size=${tagPage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}">涓婁竴椤?/a>
                                </li>
                                <th:block th:with="startPage=${T(java.lang.Math).max(1, tagPage.current - 2)}, endPage=${T(java.lang.Math).min(tagPage.pages, T(java.lang.Math).max(1, tagPage.current - 2) + 4)}">
                                    <li th:if="${startPage > 1}" class="page-item">
                                        <a class="page-link" th:href="@{/admin/tags(page=1, size=${tagPage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}">1</a>
                                    </li>
                                    <li th:if="${startPage > 2}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                                        <li class="page-item" th:classappend="${i == tagPage.current} ? 'active'">
                                            <a class="page-link" th:href="@{/admin/tags(page=${i}, size=${tagPage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}" th:text="${i}">1</a>
                                        </li>
                                    </th:block>
                                    <li th:if="${endPage < tagPage.pages - 1}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <li th:if="${endPage < tagPage.pages}" class="page-item">
                                        <a class="page-link" th:href="@{/admin/tags(page=${tagPage.pages}, size=${tagPage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}" th:text="${tagPage.pages}">99</a>
                                    </li>
                                </th:block>
                                <li class="page-item" th:classappend="${tagPage.current >= tagPage.pages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/tags(page=${tagPage.current + 1}, size=${tagPage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}">涓嬩竴椤?/a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 鍒犻櫎纭寮圭獥 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">纭鍒犻櫎</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>纭畾瑕佸垹闄ゆ鏍囩鍚楋紵姝ゆ搷浣滀笉鍙挙閿€銆?/p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">鍙栨秷</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger">纭鍒犻櫎</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function confirmDelete(btn) {
        document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteForm').action = '/admin/tags/delete/' + btn.getAttribute('data-id');
        var modal = new bootstrap.Modal(document.getElementById('deleteModal'));
        modal.show();
    }
</script>
</body>
</html>
