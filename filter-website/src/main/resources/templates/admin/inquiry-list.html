<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('询盘管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash Messages -->

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">询盘管理</h4>
                </div>

            </div>

            <!-- Search Form -->
            <div class="admin-card mb-3">
                <div class="admin-card-body">
                    <form method="get" th:action="@{/admin/inquiries}" class="row g-2 align-items-end">
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">名称</label>
                            <input type="text" name="name" th:value="${param.name}" class="form-control form-control-sm" placeholder="客户名称...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">邮箱</label>
                            <input type="text" name="email" th:value="${param.email}" class="form-control form-control-sm" placeholder="邮箱地址...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">公司</label>
                            <input type="text" name="company" th:value="${param.company}" class="form-control form-control-sm" placeholder="公司名称...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">发送时间起</label>
                            <input type="date" name="startDate" th:value="${param.startDate}" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-1">
                            <label class="form-label form-label-sm">每页</label>
                            <select name="size" class="form-select form-select-sm">
                                <option value="10" th:selected="${inquiryPage.size == 10}">10</option>
                                <option value="20" th:selected="${inquiryPage.size == 20}">20</option>
                                <option value="50" th:selected="${inquiryPage.size == 50}">50</option>
                                <option value="100" th:selected="${inquiryPage.size == 100}">100</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> 搜索</button>
                            <a th:href="@{/admin/inquiries}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> 重置</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-card">
                <div class="admin-card-header" style="display:none;"></div>
                <div class="admin-card-body">
                    <div class="table-responsive">
                        <table class="table admin-table mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>邮箱</th>
                                <th>公司</th>
                                <th>感兴趣产品</th>
                                <th>留言内容</th>
                                <th>附件</th>
                                <th>发送时间</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="inq : ${inquiryPage.records}"
                                th:class="${inq.isRead != null and !inq.isRead} ? 'fw-medium' : ''">
                                <td th:text="${inq.id}">1</td>
                                <td th:text="${inq.name}">名称</td>
                                <td>
                                    <a th:href="'mailto:' + ${inq.email}" th:text="${inq.email}">email@example.com</a>
                                </td>
                                <td th:text="${inq.company} ?: '-'" class="text-muted">公司</td>
                                <td th:text="${inq.productInterest} ?: '-'" class="text-muted">Product</td>
                                <td>
                                    <span th:text="${#strings.abbreviate(inq.message, 50)}" class="text-muted">留言内容 preview...</span>
                                </td>
                                <td>
                                    <div th:if="${inq.attachmentPath != null and !inq.attachmentPath.isEmpty()}">
                                        <div class="mb-1" style="font-size:12px; word-break:break-all; max-width:160px;"
                                             th:text="${inq.attachmentName != null ? inq.attachmentName : 'attachment'}">filename</div>
                                        <button type="button" class="btn btn-sm btn-outline-primary me-1" title="预览"
                                                th:onclick="'previewAttachment(' + ${inq.id} + ', \'' + ${inq.attachmentName != null ? inq.attachmentName : ''} + '\')'">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                        <a th:href="@{/admin/inquiries/download/{id}(id=${inq.id})}"
                                           class="btn btn-sm btn-outline-success" title="下载" download>
                                            <i class="bi bi-download"></i>
                                        </a>
                                    </div>
                                    <span th:unless="${inq.attachmentPath != null and !inq.attachmentPath.isEmpty()}" class="text-muted">-</span>
                                </td>
                                <td class="text-muted text-nowrap"
                                    th:text="${inq.createdTime != null} ? ${#temporals.format(inq.createdTime, 'yyyy-MM-dd HH:mm')} : '-'">2026-01-01</td>
                                <td class="actions">
                                    <a th:href="@{/admin/inquiries/detail/{id}(id=${inq.id})}"
                                       class="btn btn-sm btn-outline-primary me-1" title="查看详情">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:data-id="${inq.id}"
                                            th:data-name="${inq.name + ' - ' + inq.email}"
                                            onclick="confirmDelete(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${inquiryPage.records.isEmpty()}">
                                <td colspan="9" class="text-center text-muted py-4">暂无询盘数据。</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-3 d-flex justify-content-between align-items-center" th:if="${inquiryPage.pages > 1}">
                        <span></span>
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${inquiryPage.current <= 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/inquiries(page=${inquiryPage.current - 1}, size=${inquiryPage.size}, name=${param.name}, email=${param.email}, company=${param.company}, startDate=${param.startDate})}">上一页</a>
                                </li>
                                <th:block th:with="startPage=${inquiryPage.current - 2 > 1 ? inquiryPage.current - 2 : 1}, endPage=${inquiryPage.pages < (inquiryPage.current - 2 > 1 ? inquiryPage.current - 2 : 1) + 4 ? inquiryPage.pages : (inquiryPage.current - 2 > 1 ? inquiryPage.current - 2 : 1) + 4}">
                                    <li th:if="${startPage > 1}" class="page-item">
                                        <a class="page-link" th:href="@{/admin/inquiries(page=1, size=${inquiryPage.size}, name=${param.name}, email=${param.email}, company=${param.company}, startDate=${param.startDate})}">1</a>
                                    </li>
                                    <li th:if="${startPage > 2}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                                        <li class="page-item" th:classappend="${i == inquiryPage.current} ? 'active'">
                                            <a class="page-link" th:href="@{/admin/inquiries(page=${i}, size=${inquiryPage.size}, name=${param.name}, email=${param.email}, company=${param.company}, startDate=${param.startDate})}" th:text="${i}">1</a>
                                        </li>
                                    </th:block>
                                    <li th:if="${endPage < inquiryPage.pages - 1}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <li th:if="${endPage < inquiryPage.pages}" class="page-item">
                                        <a class="page-link" th:href="@{/admin/inquiries(page=${inquiryPage.pages}, size=${inquiryPage.size}, name=${param.name}, email=${param.email}, company=${param.company}, startDate=${param.startDate})}" th:text="${inquiryPage.pages}">99</a>
                                    </li>
                                </th:block>
                                <li class="page-item" th:classappend="${inquiryPage.current >= inquiryPage.pages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/inquiries(page=${inquiryPage.current + 1}, size=${inquiryPage.size}, name=${param.name}, email=${param.email}, company=${param.company}, startDate=${param.startDate})}">下一页</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除此询盘吗？此操作不可撤销。</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger">确认删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 附件预览弹窗 -->
<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="previewModalTitle">附件预览</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center" id="previewModalBody" style="min-height:300px; padding:16px;">
                <div id="previewLoading"><i class="bi bi-hourglass-split"></i> 加载中...</div>
                <img id="previewImg" src="" alt="" style="display:none; max-width:100%; max-height:75vh; border-radius:4px;">
                <iframe id="previewIframe" src="" style="display:none; width:100%; height:75vh; border:none;"></iframe>
                <div id="previewUnsupported" style="display:none;">
                    <i class="bi bi-file-earmark" style="font-size:48px; color:#999;"></i>
                    <p class="mt-3 text-muted">该文件类型暂不支持在线预览，请下载后查看。</p>
                    <a id="previewDownloadBtn" href="#" class="btn btn-primary mt-2" download>
                        <i class="bi bi-download"></i> 下载文件
                    </a>
                </div>
            </div>
            <div class="modal-footer">
                <a id="previewModalDownload" href="#" class="btn btn-success" download>
                    <i class="bi bi-download"></i> 下载
                </a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function confirmDelete(btn) {
        document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteForm').action = '/admin/inquiries/delete/' + btn.getAttribute('data-id');
        var modal = new bootstrap.Modal(document.getElementById('deleteModal'));
        modal.show();
    }

    function previewAttachment(id, fileName) {
        var previewUrl = '/admin/inquiries/preview/' + id;
        var downloadUrl = '/admin/inquiries/download/' + id;
        // Set title
        document.getElementById('previewModalTitle').textContent = fileName || '附件预览';
        // Set download links
        document.getElementById('previewModalDownload').href = downloadUrl;
        document.getElementById('previewDownloadBtn').href = downloadUrl;
        // Reset state
        document.getElementById('previewLoading').style.display = 'block';
        document.getElementById('previewImg').style.display = 'none';
        document.getElementById('previewIframe').style.display = 'none';
        document.getElementById('previewUnsupported').style.display = 'none';
        document.getElementById('previewImg').src = '';
        document.getElementById('previewIframe').src = '';
        // Determine file type by extension
        var ext = (fileName || '').split('.').pop().toLowerCase();
        var imageExts = ['jpg','jpeg','png','gif','bmp','webp','svg'];
        var pdfExts = ['pdf'];
        var modal = new bootstrap.Modal(document.getElementById('previewModal'));
        modal.show();
        if (imageExts.indexOf(ext) >= 0) {
            var img = document.getElementById('previewImg');
            img.onload = function() {
                document.getElementById('previewLoading').style.display = 'none';
                img.style.display = 'inline-block';
            };
            img.onerror = function() {
                document.getElementById('previewLoading').style.display = 'none';
                document.getElementById('previewUnsupported').style.display = 'block';
            };
            img.src = previewUrl;
        } else if (pdfExts.indexOf(ext) >= 0) {
            var iframe = document.getElementById('previewIframe');
            iframe.onload = function() {
                document.getElementById('previewLoading').style.display = 'none';
                iframe.style.display = 'block';
            };
            iframe.src = previewUrl;
        } else {
            document.getElementById('previewLoading').style.display = 'none';
            document.getElementById('previewUnsupported').style.display = 'block';
        }
    }
</script>
</body>
</html>
