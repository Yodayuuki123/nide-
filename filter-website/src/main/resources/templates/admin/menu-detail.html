<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Menu: ' + ${menu.name})}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash Messages -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4>
                    <span th:text="${menu.name}">Menu Name</span>
                    <span class="badge bg-info text-dark fs-6 ms-2" th:text="${menu.location} ?: 'unassigned'">primary</span>
                </h4>
                <a href="/admin/menus" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.back}">Back</span>
                </a>
            </div>

            <div class="row g-4">
                <!-- Menu Items Tree -->
                <div class="col-lg-8">
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h5>Menu Items</h5>
                        </div>
                        <div class="admin-card-body">
                            <div class="table-responsive">
                                <table class="table admin-table mb-0">
                                    <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>URL</th>
                                        <th>Type</th>
                                        <th>Sort</th>
                                        <th th:text="#{admin.actions}">Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <th:block th:each="item : ${menu.menuItems}">
                                        <!-- Top-level item -->
                                        <tr th:if="${item.parentId == null or item.parentId == 0}">
                                            <td>
                                                <strong>
                                                    <i class="bi bi-list text-primary me-1"></i>
                                                    <span th:text="${item.title}">Item</span>
                                                </strong>
                                            </td>
                                            <td class="text-muted">
                                                <small th:text="${item.url}">url</small>
                                            </td>
                                            <td>
                                                <span class="badge bg-light text-dark" th:text="${item.type} ?: 'custom'">custom</span>
                                            </td>
                                            <td th:text="${item.sortOrder} ?: 0">0</td>
                                            <td class="actions">
                                                <form th:action="@{/admin/menus/items/delete/{id}(id=${item.id})}"
                                                      method="post" class="d-inline"
                                                      onsubmit="return confirm('Delete this menu item?')">
                                                    <input type="hidden" name="menuId" th:value="${menu.id}">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                        <!-- Child items -->
                                        <th:block th:each="child : ${item.children}" th:if="${item.children != null}">
                                            <tr class="table-light">
                                                <td style="padding-left: 2.5rem;">
                                                    <i class="bi bi-arrow-return-right text-muted me-1"></i>
                                                    <span th:text="${child.title}">Child Item</span>
                                                </td>
                                                <td class="text-muted">
                                                    <small th:text="${child.url}">url</small>
                                                </td>
                                                <td>
                                                    <span class="badge bg-light text-dark" th:text="${child.type} ?: 'custom'">custom</span>
                                                </td>
                                                <td th:text="${child.sortOrder} ?: 0">0</td>
                                                <td class="actions">
                                                    <form th:action="@{/admin/menus/items/delete/{id}(id=${child.id})}"
                                                          method="post" class="d-inline"
                                                          onsubmit="return confirm('Delete this menu item?')">
                                                        <input type="hidden" name="menuId" th:value="${menu.id}">
                                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </form>
                                                </td>
                                            </tr>
                                        </th:block>
                                    </th:block>
                                    <tr th:if="${menu.menuItems == null or menu.menuItems.isEmpty()}">
                                        <td colspan="5" class="text-center text-muted py-4">No menu items yet.</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Menu Item Form -->
                <div class="col-lg-4">
                    <div class="admin-form">
                        <h6 class="mb-3">Add Menu Item</h6>
                        <form th:action="@{/admin/menus/items/save}" method="post">
                            <input type="hidden" name="menuId" th:value="${menu.id}">

                            <div class="mb-3">
                                <label class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" name="title" class="form-control" required placeholder="Menu item title">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">URL <span class="text-danger">*</span></label>
                                <input type="text" name="url" class="form-control" required placeholder="/products or https://...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Type</label>
                                <select name="type" class="form-select">
                                    <option value="custom">Custom Link</option>
                                    <option value="page">Page</option>
                                    <option value="category">Category</option>
                                    <option value="product">Product</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Parent Item</label>
                                <select name="parentId" class="form-select">
                                    <option value="">— None (Top Level) —</option>
                                    <th:block th:each="item : ${menu.menuItems}">
                                        <option th:if="${item.parentId == null or item.parentId == 0}"
                                                th:value="${item.id}"
                                                th:text="${item.title}">Item</option>
                                    </th:block>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Sort Order</label>
                                <input type="number" name="sortOrder" class="form-control" value="0" placeholder="0">
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-plus-circle"></i> Add Item
                            </button>
                        </form>
                    </div>

                    <!-- Edit Menu Info -->
                    <div class="admin-form mt-4">
                        <h6 class="mb-3">Menu Settings</h6>
                        <form th:action="@{/admin/menus/save}" method="post">
                            <input type="hidden" name="id" th:value="${menu.id}">
                            <div class="mb-3">
                                <label class="form-label">Menu Name</label>
                                <input type="text" name="name" class="form-control" th:value="${menu.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <select name="location" class="form-select">
                                    <option value="">— Select —</option>
                                    <option value="primary" th:selected="${menu.location == 'primary'}">Primary</option>
                                    <option value="footer" th:selected="${menu.location == 'footer'}">Footer</option>
                                    <option value="sidebar" th:selected="${menu.location == 'sidebar'}">Sidebar</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-outline-primary w-100">
                                <i class="bi bi-check-circle"></i> Update Menu
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
