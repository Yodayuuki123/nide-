<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('菜单: ' + ${menu.name})}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash Messages -->

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">
                        <span th:text="${menu.name}">Menu Name</span>
                        <span class="badge bg-info text-dark fs-6 ms-2" th:text="${menu.location} ?: 'unassigned'">primary</span>
                    </h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">管理菜单项和结构</p>
                </div>
                <a href="/admin/menus" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.back}">返回</span>
                </a>
            </div>

            <div class="row g-4">
                <!-- 菜单项 Tree -->
                <div class="col-lg-8">
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h5>菜单项</h5>
                        </div>
                        <div class="admin-card-body">
                            <div class="table-responsive">
                                <table class="table admin-table mb-0">
                                    <thead>
                                    <tr>
                                        <th>标题</th>
                                        <th>URL</th>
                                        <th>类型</th>
                                        <th>排序</th>
                                        <th th:text="#{admin.actions}">操作</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <th:block th:each="item : ${menu.menuItems}">
                                        <!-- Top-level item -->
                                        <tr th:if="${item.parentId == null or item.parentId == 0}">
                                            <td>
                                                <strong>
                                                    <i class="bi bi-list text-primary me-1"></i>
                                                    <span th:text="${item.title}">Item</span>
                                                </strong>
                                            </td>
                                            <td class="text-muted">
                                                <small th:text="${item.url}">url</small>
                                            </td>
                                            <td>
                                                <span class="badge bg-light text-dark" th:text="${item.type} ?: 'custom'">custom</span>
                                            </td>
                                            <td th:text="${item.sortOrder} ?: 0">0</td>
                                            <td class="actions">
                                                <button type="button" class="btn btn-sm btn-outline-primary me-1"
                                                        th:data-id="${item.id}"
                                                        th:data-title="${item.title}"
                                                        th:data-url="${item.url}"
                                                        th:data-type="${item.type}"
                                                        th:data-parentid="${item.parentId}"
                                                        th:data-sortorder="${item.sortOrder}"
                                                        th:data-menuid="${menu.id}"
                                                        onclick="editItem(this)"
                                                        title="编辑">
                                                    <i class="bi bi-pencil"></i>
                                                </button>
                                                <button type="button" class="btn btn-sm btn-outline-danger"
                                                        th:data-id="${item.id}"
                                                        th:data-name="${item.title}"
                                                        th:data-menuid="${menu.id}"
                                                        onclick="confirmDeleteItem(this)">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                        <!-- Child items -->
                                        <th:block th:each="child : ${item.children}" th:if="${item.children != null}">
                                            <tr class="table-light">
                                                <td style="padding-left: 2.5rem;">
                                                    <i class="bi bi-arrow-return-right text-muted me-1"></i>
                                                    <span th:text="${child.title}">Child Item</span>
                                                </td>
                                                <td class="text-muted">
                                                    <small th:text="${child.url}">url</small>
                                                </td>
                                                <td>
                                                    <span class="badge bg-light text-dark" th:text="${child.type} ?: 'custom'">custom</span>
                                                </td>
                                                <td th:text="${child.sortOrder} ?: 0">0</td>
                                                <td class="actions">
                                                    <button type="button" class="btn btn-sm btn-outline-primary me-1"
                                                            th:data-id="${child.id}"
                                                            th:data-title="${child.title}"
                                                            th:data-url="${child.url}"
                                                            th:data-type="${child.type}"
                                                            th:data-parentid="${child.parentId}"
                                                            th:data-sortorder="${child.sortOrder}"
                                                            th:data-menuid="${menu.id}"
                                                            onclick="editItem(this)"
                                                            title="编辑">
                                                        <i class="bi bi-pencil"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                                            th:data-id="${child.id}"
                                                            th:data-name="${child.title}"
                                                            th:data-menuid="${menu.id}"
                                                            onclick="confirmDeleteItem(this)">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        </th:block>
                                    </th:block>
                                    <tr th:if="${menu.menuItems == null or menu.menuItems.isEmpty()}">
                                        <td colspan="5" class="text-center text-muted py-4">暂无菜单项。</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 新增菜单项 Form -->
                <div class="col-lg-4">
                    <div class="admin-form">
                        <h6 class="mb-3">新增菜单项</h6>
                        <form th:action="@{/admin/menus/items/save}" method="post">
                            <input type="hidden" name="menuId" th:value="${menu.id}">

                            <div class="mb-3">
                                <label class="form-label">标题 <span class="text-danger">*</span></label>
                                <input type="text" name="title" class="form-control" required placeholder="菜单项标题">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">URL <span class="text-danger">*</span></label>
                                <input type="text" name="url" class="form-control" required placeholder="/products 或 https://...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">类型</label>
                                <select name="type" class="form-select">
                                    <option value="custom">自定义链接</option>
                                    <option value="page">页面</option>
                                    <option value="category">分类</option>
                                    <option value="product">产品</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">父级菜单项</label>
                                <select name="parentId" class="form-select">
                                    <option value="">— 无（顶级） —</option>
                                    <th:block th:each="item : ${menu.menuItems}">
                                        <option th:if="${item.parentId == null or item.parentId == 0}"
                                                th:value="${item.id}"
                                                th:text="${item.title}">Item</option>
                                    </th:block>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">排序</label>
                                <input type="number" name="sortOrder" class="form-control" value="0" placeholder="0">
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-plus-circle"></i> 添加菜单项
                            </button>
                        </form>
                    </div>

                    <!-- 编辑 Menu Info -->
                    <div class="admin-form mt-4">
                        <h6 class="mb-3">菜单设置</h6>
                        <form th:action="@{/admin/menus/save}" method="post">
                            <input type="hidden" name="id" th:value="${menu.id}">
                            <div class="mb-3">
                                <label class="form-label">菜单名称</label>
                                <input type="text" name="name" class="form-control" th:value="${menu.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">位置</label>
                                <select name="location" class="form-select">
                                    <option value="">— 选择 —</option>
                                    <option value="primary" th:selected="${menu.location == 'primary'}">Primary（主导航）</option>
                                    <option value="footer" th:selected="${menu.location == 'footer'}">Footer（页脚）</option>
                                    <option value="sidebar" th:selected="${menu.location == 'sidebar'}">Sidebar（侧边栏）</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-outline-primary w-100">
                                <i class="bi bi-check-circle"></i> 更新菜单
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 编辑菜单项弹窗 -->
<div class="modal fade" id="editItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑菜单项</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editItemForm" th:action="@{/admin/menus/items/save}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="id" id="editItemId">
                    <input type="hidden" name="menuId" id="editItemMenuId">
                    <div class="mb-3">
                        <label class="form-label">标题 <span class="text-danger">*</span></label>
                        <input type="text" name="title" id="editItemTitle" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL <span class="text-danger">*</span></label>
                        <input type="text" name="url" id="editItemUrl" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">类型</label>
                        <select name="type" id="editItemType" class="form-select">
                            <option value="custom">自定义链接</option>
                            <option value="page">页面</option>
                            <option value="category">分类</option>
                            <option value="product">产品</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">父级菜单项</label>
                        <select name="parentId" id="editItemParentId" class="form-select">
                            <option value="">— 无（顶级） —</option>
                            <th:block th:each="item : ${menu.menuItems}">
                                <option th:if="${item.parentId == null or item.parentId == 0}"
                                        th:value="${item.id}"
                                        th:text="${item.title}">Item</option>
                            </th:block>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">排序</label>
                        <input type="number" name="sortOrder" id="editItemSortOrder" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal fade" id="deleteItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除此菜单项吗？此操作不可撤销。</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <form id="deleteItemForm" method="post" class="d-inline">
                    <input type="hidden" name="menuId" id="deleteMenuId">
                    <button type="submit" class="btn btn-outline-danger">确认删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function editItem(btn) {
        document.getElementById('editItemId').value = btn.getAttribute('data-id');
        document.getElementById('editItemMenuId').value = btn.getAttribute('data-menuid');
        document.getElementById('editItemTitle').value = btn.getAttribute('data-title') || '';
        document.getElementById('editItemUrl').value = btn.getAttribute('data-url') || '';
        document.getElementById('editItemSortOrder').value = btn.getAttribute('data-sortorder') || '0';

        var typeSelect = document.getElementById('editItemType');
        var typeVal = btn.getAttribute('data-type') || 'custom';
        for (var i = 0; i < typeSelect.options.length; i++) {
            if (typeSelect.options[i].value === typeVal) {
                typeSelect.selectedIndex = i;
                break;
            }
        }

        var parentSelect = document.getElementById('editItemParentId');
        var parentVal = btn.getAttribute('data-parentid') || '';
        parentSelect.value = parentVal;

        var modal = new bootstrap.Modal(document.getElementById('editItemModal'));
        modal.show();
    }

    function confirmDeleteItem(btn) {
        document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteItemForm').action = '/admin/menus/items/delete/' + btn.getAttribute('data-id');
        document.getElementById('deleteMenuId').value = btn.getAttribute('data-menuid');
        var modal = new bootstrap.Modal(document.getElementById('deleteItemModal'));
        modal.show();
    }
</script>
</body>
</html>
