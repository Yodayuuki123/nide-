<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead(${news.id != null} ? '编辑新闻' : '新增新闻')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;" th:text="${news.id != null} ? '编辑新闻' : '新增新闻'">News Form</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;" th:text="${news.id != null} ? '修改新闻文章内容' : '创建新的新闻文章'">Subtitle</p>
                </div>
                <a href="/admin/news" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> 返回
                </a>
            </div>

            <form th:action="@{/admin/news/save}" method="post" id="newsForm">
                <!-- Hidden ID for edit mode -->
                <input type="hidden" name="id" th:value="${news.id}">

                <div class="row g-4">
                    <!-- Left Column: Main Info -->
                    <div class="col-lg-8">
                        <!-- Basic Info -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">基本信息</h6>
                            <div class="mb-3">
                                <label class="form-label">标题 <span class="text-danger">*</span></label>
                                <input type="text" name="title" class="form-control" th:value="${news.title}"
                                       required id="newsTitle" placeholder="请输入新闻标题">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL别名 <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" name="slug" class="form-control" th:value="${news.slug}"
                                           required id="newsSlug" placeholder="auto-generated-from-title">
                                    <button type="button" class="btn btn-outline-secondary" id="generateSlugBtn">
                                        <i class="bi bi-arrow-repeat"></i> 生成
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">摘要</label>
                                <textarea name="summary" class="form-control" rows="3"
                                          th:text="${news.summary}" placeholder="请输入新闻摘要"></textarea>
                            </div>
                        </div>

                        <!-- Content (Rich Text) -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">新闻内容</h6>
                            <div class="tinymce-wrapper">
                                <textarea name="content" id="newsContent" rows="15"
                                          th:utext="${news.content}"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Side Panels -->
                    <div class="col-lg-4">
                        <!-- Cover Image -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">封面图片</h6>
                            <div class="mb-3">
                                <label class="form-label">封面图片URL</label>
                                <input type="text" name="coverImage" class="form-control"
                                       th:value="${news.coverImage}" placeholder="https://example.com/image.jpg">
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">发布设置</h6>
                            <div class="mb-3">
                                <label class="form-label">状态 <span class="text-danger">*</span></label>
                                <select name="status" class="form-select" required>
                                    <option value="draft" th:selected="${news.status == null or news.status == 'draft'}">草稿</option>
                                    <option value="published" th:selected="${news.status == 'published'}">已发布</option>
                                </select>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> 保存
                            </button>
                            <a href="/admin/news" class="btn btn-outline-secondary">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- TinyMCE (free self-hosted via jsDelivr CDN, no API key needed) -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>

<script>
(function() {
    // Slug generation from title
    var titleInput = document.getElementById('newsTitle');
    var slugInput = document.getElementById('newsSlug');
    var generateBtn = document.getElementById('generateSlugBtn');

    if (generateBtn && titleInput && slugInput) {
        generateBtn.addEventListener('click', function() {
            var title = titleInput.value.trim();
            if (title) {
                var slug = title.toLowerCase()
                    .replace(/[^\w\u4e00-\u9fa5\s-]/g, '')
                    .replace(/[\s_]+/g, '-')
                    .replace(/^-+|-+$/g, '');
                slugInput.value = slug;
            }
        });
    }

    // TinyMCE initialization for news content
    if (typeof tinymce !== 'undefined') {
        tinymce.remove('#newsContent');

        tinymce.init({
            selector: '#newsContent',
            height: 550,
            menubar: 'file edit view insert format table',
            plugins: 'lists link image table code fullscreen preview media hr anchor charmap wordcount visualblocks pagebreak',
            toolbar: [
                'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | forecolor backcolor removeformat',
                'alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image media table | hr pagebreak charmap | visualblocks code fullscreen'
            ],
            content_style: 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.8; padding: 16px; max-width: 900px; margin: 0 auto; } img { max-width: 100%; height: auto; border-radius: 4px; } table { border-collapse: collapse; width: 100%; } table td, table th { border: 1px solid #ddd; padding: 8px; }',
            images_upload_handler: function(blobInfo) {
                return new Promise(function(resolve, reject) {
                    var formData = new FormData();
                    formData.append('file', blobInfo.blob(), blobInfo.filename());

                    fetch('/admin/api/images/upload', {
                        method: 'POST',
                        body: formData
                    })
                    .then(function(resp) { return resp.json(); })
                    .then(function(data) {
                        if (data.success) {
                            resolve(data.url);
                        } else {
                            reject('上传失败: ' + (data.message || '未知错误'));
                        }
                    })
                    .catch(function(err) {
                        reject('上传失败: ' + err.message);
                    });
                });
            },
            file_picker_types: 'image',
            file_picker_callback: function(callback, value, meta) {
                if (meta.filetype === 'image') {
                    var input = document.createElement('input');
                    input.setAttribute('type', 'file');
                    input.setAttribute('accept', 'image/*');
                    input.onchange = function() {
                        var file = this.files[0];
                        var formData = new FormData();
                        formData.append('file', file);

                        fetch('/admin/api/images/upload', {
                            method: 'POST',
                            body: formData
                        })
                        .then(function(resp) { return resp.json(); })
                        .then(function(data) {
                            if (data.success) {
                                callback(data.url, { alt: file.name });
                            }
                        });
                    };
                    input.click();
                }
            },
            promotion: false,
            branding: false,
            convert_urls: false,
            relative_urls: false,
            placeholder: '请输入新闻内容，支持插入图片、表格、视频等富文本内容...',
            image_caption: true,
            image_advtab: true,
            table_default_styles: { 'border-collapse': 'collapse', 'width': '100%' },
            table_default_attributes: { border: '1' }
        });
    }

    // Ensure TinyMCE content syncs before form submit
    var form = document.getElementById('newsForm');
    if (form) {
        form.addEventListener('submit', function() {
            if (typeof tinymce !== 'undefined') {
                tinymce.triggerSave();
            }
        });
    }
})();
</script>
</body>
</html>
