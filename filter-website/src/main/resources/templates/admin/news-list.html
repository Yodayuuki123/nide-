<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('新闻管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash 留言内容s -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">新闻管理</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">管理您的新闻文章</p>
                </div>
                <a href="/admin/news/add" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> 新增新闻
                </a>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>全部新闻</h5>
                </div>
                <div class="admin-card-body">
                    <div class="table-responsive">
                        <table class="table admin-table mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>标题</th>
                                <th>状态</th>
                                <th>浏览量</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="news : ${newsPage.records}">
                                <td th:text="${news.id}">1</td>
                                <td>
                                    <a th:href="@{/admin/news/edit/{id}(id=${news.id})}"
                                       th:text="${news.title}" class="fw-medium">新闻标题</a>
                                </td>
                                <td>
                                    <span class="badge status-badge"
                                          th:classappend="${news.status == 'published'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${news.status == 'published'} ? '已发布' : '草稿'">已发布</span>
                                </td>
                                <td class="text-muted" th:text="${news.viewCount} ?: '0'">0</td>
                                <td class="text-muted" th:text="${news.createdTime != null} ? ${#temporals.format(news.createdTime, 'yyyy-MM-dd')} : '-'">2026-01-01</td>
                                <td class="actions">
                                    <a th:href="@{/admin/news/edit/{id}(id=${news.id})}"
                                       class="btn btn-sm btn-outline-primary me-1" title="编辑">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:data-id="${news.id}"
                                            th:data-name="${news.title}"
                                            data-bs-toggle="modal" data-bs-target="#deleteModal"
                                            onclick="prepareDelete(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${newsPage.records.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-4">暂无新闻数据。</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-3" th:if="${newsPage.pages > 1}">
                        <nav>
                            <ul class="pagination mb-0 justify-content-center">
                                <li class="page-item" th:classappend="${newsPage.current <= 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/news(page=${newsPage.current - 1}, size=${newsPage.size})}">上一页</a>
                                </li>
                                <th:block th:each="i : ${#numbers.sequence(1, newsPage.pages)}">
                                    <li class="page-item" th:classappend="${i == newsPage.current} ? 'active'">
                                        <a class="page-link" th:href="@{/admin/news(page=${i}, size=${newsPage.size})}" th:text="${i}">1</a>
                                    </li>
                                </th:block>
                                <li class="page-item" th:classappend="${newsPage.current >= newsPage.pages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/news(page=${newsPage.current + 1}, size=${newsPage.size})}">下一页</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除以下新闻吗？此操作不可撤销。</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger">确认删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function prepareDelete(btn) {
        document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteForm').action = '/admin/news/delete/' + btn.getAttribute('data-id');
    }
</script>
</body>
</html>
