<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('新闻管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash Messages -->

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">新闻管理</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">管理您的新闻文章</p>
                </div>
                <a href="/admin/news/add" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> 新增新闻
                </a>
            </div>

            <!-- Search Form -->
            <div class="admin-card mb-3">
                <div class="admin-card-body">
                    <form method="get" th:action="@{/admin/news}" class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label form-label-sm">标题</label>
                            <input type="text" name="keyword" th:value="${param.keyword}" class="form-control form-control-sm" placeholder="搜索新闻标题...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">状态</label>
                            <select name="status" class="form-select form-select-sm">
                                <option value="">全部</option>
                                <option value="published" th:selected="${param.status != null and param.status == 'published'}">已发布</option>
                                <option value="draft" th:selected="${param.status != null and param.status == 'draft'}">草稿</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">创建时间起</label>
                            <input type="date" name="startDate" th:value="${param.startDate}" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">每页显示</label>
                            <select name="size" class="form-select form-select-sm">
                                <option value="10" th:selected="${newsPage.size == 10}">10</option>
                                <option value="20" th:selected="${newsPage.size == 20}">20</option>
                                <option value="50" th:selected="${newsPage.size == 50}">50</option>
                                <option value="100" th:selected="${newsPage.size == 100}">100</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> 搜索</button>
                            <a th:href="@{/admin/news}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> 重置</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>全部新闻</h5>
                    <span class="text-muted" th:text="'共 ' + ${newsPage.total} + ' 条'"></span>
                </div>
                <div class="admin-card-body">
                    <div class="table-responsive">
                        <table class="table admin-table mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>标题</th>
                                <th>状态</th>
                                <th>浏览量</th>
                                <th>修改时间</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="news : ${newsPage.records}">
                                <td th:text="${news.id}">1</td>
                                <td>
                                    <a th:href="@{/admin/news/edit/{id}(id=${news.id})}"
                                       th:text="${news.title}" class="fw-medium">新闻标题</a>
                                </td>
                                <td>
                                    <span class="badge status-badge"
                                          th:classappend="${news.status == 'published'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${news.status == 'published'} ? '已发布' : '草稿'">已发布</span>
                                </td>
                                <td class="text-muted" th:text="${news.viewCount} ?: '0'">0</td>
                                <td class="text-muted" th:text="${news.updatedTime != null} ? ${#temporals.format(news.updatedTime, 'yyyy-MM-dd HH:mm')} : (${news.createdTime != null} ? ${#temporals.format(news.createdTime, 'yyyy-MM-dd HH:mm')} : '-')">2026-01-01</td>
                                <td class="actions">
                                    <a th:href="@{/admin/news/edit/{id}(id=${news.id})}"
                                       class="btn btn-sm btn-outline-primary me-1" title="编辑">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:data-id="${news.id}"
                                            th:data-name="${news.title}"
                                            onclick="confirmDelete(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${newsPage.records.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-4">暂无新闻数据。</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-3 d-flex justify-content-between align-items-center" th:if="${newsPage.pages > 1}">
                        <span class="text-muted" style="font-size:13px;" th:text="'显示 ' + ${(newsPage.current - 1) * newsPage.size + 1} + '-' + ${T(Math).min(newsPage.current * newsPage.size, newsPage.total)} + ' / 共 ' + ${newsPage.total} + ' 条'"></span>
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${newsPage.current <= 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/news(page=${newsPage.current - 1}, size=${newsPage.size}, keyword=${param.keyword}, status=${param.status}, startDate=${param.startDate})}">上一页</a>
                                </li>
                                <th:block th:with="startPage=${T(Math).max(1, newsPage.current - 2)}, endPage=${T(Math).min(newsPage.pages, T(Math).max(1, newsPage.current - 2) + 4)}">
                                    <li th:if="${startPage > 1}" class="page-item">
                                        <a class="page-link" th:href="@{/admin/news(page=1, size=${newsPage.size}, keyword=${param.keyword}, status=${param.status}, startDate=${param.startDate})}">1</a>
                                    </li>
                                    <li th:if="${startPage > 2}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                                        <li class="page-item" th:classappend="${i == newsPage.current} ? 'active'">
                                            <a class="page-link" th:href="@{/admin/news(page=${i}, size=${newsPage.size}, keyword=${param.keyword}, status=${param.status}, startDate=${param.startDate})}" th:text="${i}">1</a>
                                        </li>
                                    </th:block>
                                    <li th:if="${endPage < newsPage.pages - 1}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <li th:if="${endPage < newsPage.pages}" class="page-item">
                                        <a class="page-link" th:href="@{/admin/news(page=${newsPage.pages}, size=${newsPage.size}, keyword=${param.keyword}, status=${param.status}, startDate=${param.startDate})}" th:text="${newsPage.pages}">99</a>
                                    </li>
                                </th:block>
                                <li class="page-item" th:classappend="${newsPage.current >= newsPage.pages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/news(page=${newsPage.current + 1}, size=${newsPage.size}, keyword=${param.keyword}, status=${param.status}, startDate=${param.startDate})}">下一页</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除以下新闻吗？此操作不可撤销。</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger">确认删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function confirmDelete(btn) {
        document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteForm').action = '/admin/news/delete/' + btn.getAttribute('data-id');
        var modal = new bootstrap.Modal(document.getElementById('deleteModal'));
        modal.show();
    }
</script>
</body>
</html>
