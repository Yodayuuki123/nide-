<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('新闻管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">新闻管理</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">发布和管理网站新闻文章</p>
                </div>
                <a href="/admin/news/add" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> 发布新闻
                </a>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>所有新闻 <span class="badge bg-secondary ms-1" th:text="${newsPage.total}">0</span></h5>
                </div>
                <div class="admin-card-body">
                    <div class="table-responsive">
                        <table class="table admin-table mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>封面</th>
                                <th>标题</th>
                                <th>状态</th>
                                <th>发布时间</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${newsPage.records}">
                                <td th:text="${item.id}">1</td>
                                <td>
                                    <img th:if="${item.coverImage != null}"
                                         th:src="${item.coverImage.url != null} ? ${item.coverImage.url} : '/wp-content/uploads' + ${item.coverImage.filePath}"
                                         style="width: 60px; height: 40px; object-fit: cover; border-radius: 4px;">
                                    <span th:if="${item.coverImage == null}" class="text-muted">—</span>
                                </td>
                                <td>
                                    <strong th:text="${item.title}">标题</strong>
                                    <div class="text-muted small" th:if="${item.summary != null}"
                                         th:text="${#strings.abbreviate(item.summary, 50)}">摘要</div>
                                </td>
                                <td>
                                    <span th:if="${item.status == 'publish'}" class="badge bg-success">已发布</span>
                                    <span th:if="${item.status != 'publish'}" class="badge bg-warning text-dark">草稿</span>
                                </td>
                                <td class="text-muted"
                                    th:text="${item.publishedAt != null} ? ${#temporals.format(item.publishedAt, 'yyyy-MM-dd HH:mm')} : '—'">—</td>
                                <td class="text-muted"
                                    th:text="${item.createdAt != null} ? ${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')} : '—'">—</td>
                                <td class="actions">
                                    <a th:href="@{/admin/news/edit/{id}(id=${item.id})}"
                                       class="btn btn-sm btn-outline-primary me-1" title="编辑">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:data-id="${item.id}"
                                            th:data-name="${item.title}"
                                            data-bs-toggle="modal" data-bs-target="#deleteModal"
                                            onclick="prepareDelete(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${newsPage.records == null or newsPage.records.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">暂无新闻数据。</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- 分页 -->
                    <div th:if="${newsPage.pages > 1}" class="d-flex justify-content-center mt-3">
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${newsPage.current == 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/news(page=${newsPage.current - 1})}">上一页</a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(1, newsPage.pages)}" class="page-item"
                                    th:classappend="${i == newsPage.current} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/news(page=${i})}" th:text="${i}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${newsPage.current == newsPage.pages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/news(page=${newsPage.current + 1})}">下一页</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认 Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除此新闻吗？此操作不可撤销。</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger">删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function prepareDelete(btn) {
        document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteForm').action = '/admin/news/delete/' + btn.getAttribute('data-id');
    }
</script>
</body>
</html>
