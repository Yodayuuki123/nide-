<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('角色管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>
    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">角色管理</h4>
                </div>
                <a href="/admin/roles/add" class="btn btn-primary btn-sm"><i class="bi bi-plus-circle"></i> 新增角色</a>
            </div>

            <div class="admin-card mb-3">
                <div class="admin-card-body">
                    <form method="get" th:action="@{/admin/roles}" class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label form-label-sm">关键词</label>
                            <input type="text" name="keyword" th:value="${param.keyword}" class="form-control form-control-sm" placeholder="搜索角色名称...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">每页显示</label>
                            <select name="size" class="form-select form-select-sm">
                                <option value="10" th:selected="${rolePage.size == 10}">10</option>
                                <option value="20" th:selected="${rolePage.size == 20}">20</option>
                                <option value="50" th:selected="${rolePage.size == 50}">50</option>
                                <option value="100" th:selected="${rolePage.size == 100}">100</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> 搜索</button>
                            <a th:href="@{/admin/roles}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> 重置</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-card">
                <div class="admin-card-header"><h5 class="mb-0">全部角色</h5></div>
                <div class="admin-card-body">
                    <table class="table admin-table mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>角色标识</th>
                            <th>角色名称</th>
                            <th>描述</th>
                            <th>权限数</th>
                            <th>更新时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="role : ${rolePage.records}">
                            <td th:text="${role.id}">1</td>
                            <td><code th:text="${role.name}">ADMIN</code></td>
                            <td><strong th:text="${role.displayName}">Administrator</strong></td>
                            <td th:text="${role.description} ?: '-'">-</td>
                            <td><span class="badge bg-info" th:text="${role.permissions != null ? role.permissions.size() : 0}">0</span></td>
                            <td class="text-muted" th:text="${role.updatedAt != null ? #temporals.format(role.updatedAt, 'yyyy-MM-dd HH:mm') : (role.createdAt != null ? #temporals.format(role.createdAt, 'yyyy-MM-dd HH:mm') : '-')}">2026-01-01</td>
                            <td class="actions">
                                <a th:href="@{/admin/roles/edit/{id}(id=${role.id})}" class="btn btn-outline-primary btn-sm" title="Edit"><i class="bi bi-pencil"></i></a>
                                <button type="button" class="btn btn-outline-danger btn-sm" th:data-id="${role.id}" th:data-name="${role.displayName}" onclick="confirmDelete(this)"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr th:if="${rolePage.records.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">暂无角色数据。</td></tr>
                        </tbody>
                    </table>

                    <div class="p-3 d-flex justify-content-between align-items-center" th:if="${rolePage.pages > 1}">
                        <span class="text-muted" style="font-size:13px;" th:text="'显示 ' + ${(rolePage.current - 1) * rolePage.size + 1} + '-' + ${rolePage.current * rolePage.size < rolePage.total ? rolePage.current * rolePage.size : rolePage.total} + ' / 共 ' + ${rolePage.total} + ' 条'"></span>
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${rolePage.current <= 1} ? 'disabled'"><a class="page-link" th:href="@{/admin/roles(page=${rolePage.current - 1}, size=${rolePage.size}, keyword=${param.keyword})}">上一页</a></li>
                                <th:block th:with="startPage=${rolePage.current - 2 > 1 ? rolePage.current - 2 : 1}, endPage=${rolePage.pages < (rolePage.current - 2 > 1 ? rolePage.current - 2 : 1) + 4 ? rolePage.pages : (rolePage.current - 2 > 1 ? rolePage.current - 2 : 1) + 4}">
                                    <li th:if="${startPage > 1}" class="page-item"><a class="page-link" th:href="@{/admin/roles(page=1, size=${rolePage.size}, keyword=${param.keyword})}">1</a></li>
                                    <li th:if="${startPage > 2}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                                        <li class="page-item" th:classappend="${i == rolePage.current} ? 'active'"><a class="page-link" th:href="@{/admin/roles(page=${i}, size=${rolePage.size}, keyword=${param.keyword})}" th:text="${i}">1</a></li>
                                    </th:block>
                                    <li th:if="${endPage < rolePage.pages - 1}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <li th:if="${endPage < rolePage.pages}" class="page-item"><a class="page-link" th:href="@{/admin/roles(page=${rolePage.pages}, size=${rolePage.size}, keyword=${param.keyword})}" th:text="${rolePage.pages}">99</a></li>
                                </th:block>
                                <li class="page-item" th:classappend="${rolePage.current >= rolePage.pages} ? 'disabled'"><a class="page-link" th:href="@{/admin/roles(page=${rolePage.current + 1}, size=${rolePage.size}, keyword=${param.keyword})}">下一页</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center py-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 2.5rem;"></i>
                <p class="mt-3 mb-1">确认删除此角色？</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer justify-content-center border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <form id="deleteForm" method="post" class="d-inline"><button type="submit" class="btn btn-danger btn-sm">确认删除</button></form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
function confirmDelete(btn) {
    document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/roles/delete/' + btn.getAttribute('data-id');
    bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteModal')).show();
}
</script>
</body>
</html>
