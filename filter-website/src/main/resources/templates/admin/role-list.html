<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('角色管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash 留言内容s -->

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">角色管理</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">配置团队成员的角色和权限</p>
                </div>
                <a href="/admin/roles/add" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> 新增角色
                </a>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>All 角色</h5>
                </div>
                <div class="admin-card-body">
                    <table class="table admin-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>角色标识</th>
                            <th>角色名称</th>
                            <th>描述</th>
                            <th>权限数量</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="role : ${roles}">
                            <td th:text="${role.id}">1</td>
                            <td><code th:text="${role.name}">ADMIN</code></td>
                            <td><strong th:text="${role.displayName}">系统管理员</strong></td>
                            <td th:text="${role.description ?: '-'}">描述</td>
                            <td>
                                <span class="badge bg-info" th:text="${role.permissions != null ? role.permissions.size() : 0}">0</span> 个权限
                            </td>
                            <td>
                                <small th:text="${role.createdAt != null ? #temporals.format(role.createdAt, 'yyyy-MM-dd') : '-'}">2026-01-01</small>
                            </td>
                            <td class="actions">
                                <a th:href="@{/admin/roles/edit/{id}(id=${role.id})}"
                                   class="btn btn-outline-primary btn-sm" title="编辑">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button type="button" class="btn btn-outline-danger btn-sm" title="删除"
                                        th:data-id="${role.id}" th:data-name="${role.displayName}"
                                        onclick="confirmDelete(this)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${roles == null or roles.isEmpty()}">
                            <td colspan="7" class="text-center text-muted py-4">暂无角色数据</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center py-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 2.5rem;"></i>
                <p class="mt-3 mb-1">确定要删除以下角色吗？</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer justify-content-center border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm">确认删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function confirmDelete(btn) {
        document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteForm').action = '/admin/roles/delete/' + btn.getAttribute('data-id');
        var modal = new bootstrap.Modal(document.getElementById('deleteModal'));
        modal.show();
    }
</script>
</body>
</html>
