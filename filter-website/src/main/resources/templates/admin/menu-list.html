<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('菜单管理')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>
    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">菜单管理</h4>
                </div>
            </div>

            <div class="admin-card mb-3">
                <div class="admin-card-body">
                    <form method="get" th:action="@{/admin/menus}" class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label form-label-sm">菜单名称</label>
                            <input type="text" name="keyword" th:value="${param.keyword}" class="form-control form-control-sm" placeholder="搜索菜单名称...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">位置</label>
                            <select name="location" class="form-select form-select-sm">
                                <option value="">全部</option>
                                <option value="primary" th:selected="${param.location == 'primary'}">主导航</option>
                                <option value="footer" th:selected="${param.location == 'footer'}">页脚</option>
                                <option value="sidebar" th:selected="${param.location == 'sidebar'}">侧边栏</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label form-label-sm">每页显示</label>
                            <select name="size" class="form-select form-select-sm">
                                <option value="10" th:selected="${menuPage.size == 10}">10</option>
                                <option value="20" th:selected="${menuPage.size == 20}">20</option>
                                <option value="50" th:selected="${menuPage.size == 50}">50</option>
                                <option value="100" th:selected="${menuPage.size == 100}">100</option>
                            </select>
                        </div>
                        <div class="col-md-5 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> 搜索</button>
                            <a th:href="@{/admin/menus}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> 重置</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="admin-card">
                        <div class="admin-card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">全部菜单</h5>

                        </div>
                        <div class="admin-card-body">
                            <div class="table-responsive">
                                <table class="table admin-table mb-0">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>菜单名称</th>
                                        <th>位置</th>
                                        <th>菜单项数</th>
                                        <th>更新时间</th>
                                        <th>操作</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="menu : ${menuPage.records}">
                                        <td th:text="${menu.id}">1</td>
                                        <td><a th:href="@{/admin/menus/{id}(id=${menu.id})}" th:text="${menu.name}" class="fw-medium">Menu Name</a></td>
                                        <td><span class="badge bg-info text-dark" th:text="${menu.location == 'primary' ? '主导航' : (menu.location == 'footer' ? '页脚' : (menu.location == 'sidebar' ? '侧边栏' : '未分配'))}">primary</span></td>
                                        <td><span class="badge bg-light text-dark" th:text="${menu.menuItems != null ? menu.menuItems.size() : 0}">0</span></td>
                                        <td class="text-muted" th:text="${menu.updatedAt != null ? #temporals.format(menu.updatedAt, 'yyyy-MM-dd HH:mm') : (menu.createdAt != null ? #temporals.format(menu.createdAt, 'yyyy-MM-dd HH:mm') : '-')}">2026-01-01</td>
                                        <td class="actions">
                                            <a th:href="@{/admin/menus/{id}(id=${menu.id})}" class="btn btn-sm btn-outline-primary me-1" title="管理"><i class="bi bi-gear"></i></a>
                                            <button type="button" class="btn btn-sm btn-outline-danger" th:data-id="${menu.id}" th:data-name="${menu.name}" onclick="confirmDelete(this)"><i class="bi bi-trash"></i></button>
                                        </td>
                                    </tr>
                                    <tr th:if="${menuPage.records.isEmpty()}">
                                        <td colspan="6" class="text-center text-muted py-4">暂无菜单数据。</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="p-3 d-flex justify-content-between align-items-center" th:if="${menuPage.pages > 1}">
                                <span></span>
                                <nav>
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${menuPage.current <= 1} ? 'disabled'">
                                            <a class="page-link" th:href="@{/admin/menus(page=${menuPage.current - 1}, size=${menuPage.size}, keyword=${param.keyword}, location=${param.location})}">上一页</a>
                                        </li>
                                        <th:block th:with="startPage=${menuPage.current - 2 > 1 ? menuPage.current - 2 : 1}, endPage=${menuPage.pages < (menuPage.current - 2 > 1 ? menuPage.current - 2 : 1) + 4 ? menuPage.pages : (menuPage.current - 2 > 1 ? menuPage.current - 2 : 1) + 4}">
                                            <li th:if="${startPage > 1}" class="page-item">
                                                <a class="page-link" th:href="@{/admin/menus(page=1, size=${menuPage.size}, keyword=${param.keyword}, location=${param.location})}">1</a>
                                            </li>
                                            <li th:if="${startPage > 2}" class="page-item disabled"><span class="page-link">...</span></li>
                                            <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                                                <li class="page-item" th:classappend="${i == menuPage.current} ? 'active'">
                                                    <a class="page-link" th:href="@{/admin/menus(page=${i}, size=${menuPage.size}, keyword=${param.keyword}, location=${param.location})}" th:text="${i}">1</a>
                                                </li>
                                            </th:block>
                                            <li th:if="${endPage < menuPage.pages - 1}" class="page-item disabled"><span class="page-link">...</span></li>
                                            <li th:if="${endPage < menuPage.pages}" class="page-item">
                                                <a class="page-link" th:href="@{/admin/menus(page=${menuPage.pages}, size=${menuPage.size}, keyword=${param.keyword}, location=${param.location})}" th:text="${menuPage.pages}">99</a>
                                            </li>
                                        </th:block>
                                        <li class="page-item" th:classappend="${menuPage.current >= menuPage.pages} ? 'disabled'">
                                            <a class="page-link" th:href="@{/admin/menus(page=${menuPage.current + 1}, size=${menuPage.size}, keyword=${param.keyword}, location=${param.location)}">下一页</a>>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="admin-form">
                        <h6 class="mb-3">新建菜单</h6>
                        <form th:action="@{/admin/menus/save}" method="post">
                            <div class="mb-3">
                                <label class="form-label">菜单名称 <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" required placeholder="例如：主导航菜单">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">位置</label>
                                <select name="location" class="form-select">
                                    <option value="">-- 请选择 --</option>
                                    <option value="primary">主导航</option>
                                    <option value="footer">页脚</option>
                                    <option value="sidebar">侧边栏</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-plus-circle"></i> 创建菜单
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除此菜单及其所有菜单项？</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger">确认删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
function confirmDelete(btn) {
    document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
    document.getElementById('deleteForm').action = '/admin/menus/delete/' + btn.getAttribute('data-id');
    var modal = new bootstrap.Modal(document.getElementById('deleteModal'));
    modal.show();
}
</script>
</body>
</html>
