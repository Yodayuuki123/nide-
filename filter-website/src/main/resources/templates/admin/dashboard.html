<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('控制台')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash 留言内容s -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="mb-5">
                <h4 style="font-size: 2rem; margin-bottom: 4px;">控制台</h4>
                <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">网站内容与数据概览</p>
            </div>

            <!-- Stats Cards Row 1 -->
            <div class="row g-4 mb-4">
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-card-icon bg-blue">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <div class="stat-card-info">
                            <h3 th:text="${productCount}">0</h3>
                            <p>产品管理</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-card-icon bg-green">
                            <i class="bi bi-folder2"></i>
                        </div>
                        <div class="stat-card-info">
                            <h3 th:text="${categoryCount}">0</h3>
                            <p>分类管理</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-card-icon bg-orange">
                            <i class="bi bi-image"></i>
                        </div>
                        <div class="stat-card-info">
                            <h3 th:text="${imageCount}">0</h3>
                            <p>图片管理</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-card-icon bg-purple">
                            <i class="bi bi-chat-dots"></i>
                        </div>
                        <div class="stat-card-info">
                            <h3 th:text="${inquiryCount ?: 0}">0</h3>
                            <p>询盘管理</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick 操作 -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>快捷操作</h5>
                </div>
                <div class="admin-card-body p-4">
                    <div class="d-flex flex-wrap gap-3">
                        <a href="/admin/products/add" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> 新增产品
                        </a>
                        <a href="/admin/categories/add" class="btn btn-outline-primary">
                            <i class="bi bi-folder-plus"></i> 新增分类
                        </a>
                        <a href="/admin/images" class="btn btn-outline-primary">
                            <i class="bi bi-cloud-upload"></i> 上传图片
                        </a>
                        <a href="/admin/menus" class="btn btn-outline-secondary">
                            <i class="bi bi-list-nested"></i> 菜单管理
                        </a>
                        <a href="/admin/settings" class="btn btn-outline-secondary"
                           sec:authorize="hasAnyAuthority('setting:view', 'setting:edit')">
                            <i class="bi bi-gear"></i> 网站设置
                        </a>
                        <a href="/admin/users" class="btn btn-outline-secondary"
                           sec:authorize="hasRole('ADMIN')">
                            <i class="bi bi-people"></i> 用户管理
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
