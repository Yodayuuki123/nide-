<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead(${product.id != null} ? '编辑产品' : '新增产品')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;" th:text="${product.id != null} ? '编辑产品' : '新增产品'">产品表单</h4>
                </div>
                <a href="/admin/products" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.back}">返回</span>
                </a>
            </div>

            <form th:action="@{/admin/products/save}" method="post" id="productForm">
                <!-- Hidden ID for edit mode -->
                <input type="hidden" name="id" th:value="${product.id}">

                <div class="row g-4">
                    <!-- Left Column: Main Info -->
                    <div class="col-lg-8">
                        <!-- Basic Info -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">基本信息</h6>
                            <div class="mb-3">
                                <label class="form-label">产品名称 <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" th:value="${product.name}"
                                       required id="productName" placeholder="请输入产品名称">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL别名</label>
                                <input type="text" name="slug" class="form-control" th:value="${product.slug}"
                                       id="productSlug" placeholder="自动生成自名称">
                            </div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">SKU</label>
                                    <input type="text" name="sku" class="form-control" th:value="${product.sku}"
                                           placeholder="产品SKU">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">价格</label>
                                    <input type="number" name="price" class="form-control" step="0.01"
                                           th:value="${product.price}" placeholder="0.00">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">优惠价格</label>
                                    <input type="number" name="salePrice" class="form-control" step="0.01"
                                           th:value="${product.salePrice}" placeholder="0.00">
                                </div>
                            </div>
                            <div class="row g-3 mt-0">
                                <div class="col-md-4">
                                    <label class="form-label">库存数量</label>
                                    <input type="number" name="stockQuantity" class="form-control"
                                           th:value="${product.stockQuantity}" placeholder="0">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">状态 <span class="text-danger">*</span></label>
                                    <select name="status" class="form-select" required>
                                        <option value="draft" th:selected="${product.status == 'draft'}">草稿</option>
                                        <option value="publish" th:selected="${product.status == 'publish'}">已发布</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 第一部分: 简要介绍 (简短描述 - Rich Text HTML Fragment) -->
                        <div class="admin-form mb-4">
                            <div class="d-flex align-items-center mb-3">
                                <span class="badge bg-primary me-2">第一部分</span>
                                <h6 class="mb-0">产品简要介绍</h6>
                                <small class="text-muted ms-2">（产品详情页上半部分，简要概述产品特点）</small>
                            </div>
                            <p class="text-muted small mb-2">
                                <i class="bi bi-info-circle"></i>
                                此部分显示在产品详情页的产品信息区域，支持图文混排。建议包含产品亮点、核心参数等。
                            </p>
                            <div class="tinymce-wrapper">
                                <textarea name="shortDescription" id="shortDescription" rows="8"
                                          th:utext="${product.shortDescription}"></textarea>
                            </div>
                        </div>

                        <!-- 第二部分: 详细介绍 (详细描述 - Rich Text HTML Fragment) -->
                        <div class="admin-form mb-4">
                            <div class="d-flex align-items-center mb-3">
                                <span class="badge bg-success me-2">第二部分</span>
                                <h6 class="mb-0">产品详细介绍</h6>
                                <small class="text-muted ms-2">（产品详情页下半部分，详细产品描述）</small>
                            </div>
                            <p class="text-muted small mb-2">
                                <i class="bi bi-info-circle"></i>
                                此部分显示在产品详情页下方独立区域，支持图文并茂的富文本内容。建议包含详细规格、应用场景、技术参数等。
                            </p>
                            <div class="tinymce-wrapper">
                                <textarea name="description" id="description" rows="15"
                                          th:utext="${product.description}"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Side Panels -->
                    <div class="col-lg-4">
                        <!-- Main 图片 -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">主图</h6>
                            <input type="hidden" name="mainImageId" id="mainImageId" th:value="${product.mainImageId}">
                            <div id="mainImagePreview" class="mb-2">
                                <img th:if="${product.mainImage != null}" th:src="${product.mainImage.url}"
                                     class="img-fluid rounded" style="max-height: 200px;">
                                <div th:unless="${product.mainImage != null}"
                                     class="placeholder-img rounded d-flex align-items-center justify-content-center"
                                     style="height: 150px; background: #f0f2f5;">
                                    <i class="bi bi-image fs-1 text-muted"></i>
                                </div>
                            </div>
                            <button type="button" class="btn btn-outline-primary btn-sm w-100"
                                    onclick="openImagePicker('main')">
                                <i class="bi bi-image"></i> 选择主图
                            </button>
                        </div>

                        <!-- Gallery 图片s -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">图片库</h6>
                            <div id="galleryImagesContainer" class="d-flex flex-wrap gap-2 mb-2">
                                <div th:each="img : ${product.images}" class="gallery-thumb-item position-relative"
                                     th:data-id="${img.id}">
                                    <img th:src="${img.url}" class="rounded" style="width: 80px; height: 80px; object-fit: cover;">
                                    <input type="hidden" name="imageIds" th:value="${img.id}">
                                    <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0"
                                            style="padding: 0 4px; font-size: 0.7rem; line-height: 1.4;"
                                            onclick="removeGalleryImage(this)">
                                        <i class="bi bi-x"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="btn btn-outline-primary btn-sm w-100"
                                    onclick="openImagePicker('gallery')">
                                <i class="bi bi-images"></i> 添加图片
                            </button>
                        </div>

                        <!-- 所属分类 -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3" th:text="#{product.category}">所属分类</h6>
                            <div class="category-checkbox-tree">
                                <th:block th:each="cat : ${categories}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="categoryIds"
                                               th:value="${cat.id}" th:id="'cat_' + ${cat.id}"
                                               th:checked="${product.categories != null and #lists.contains(product.categories.![id], cat.id)}">
                                        <label class="form-check-label" th:for="'cat_' + ${cat.id}"
                                               th:text="${cat.name}">Category</label>
                                    </div>
                                    <div class="sub-categories" th:if="${cat.children != null and !cat.children.isEmpty()}">
                                        <div class="form-check" th:each="child : ${cat.children}">
                                            <input class="form-check-input" type="checkbox" name="categoryIds"
                                                   th:value="${child.id}" th:id="'cat_' + ${child.id}"
                                                   th:checked="${product.categories != null and #lists.contains(product.categories.![id], child.id)}">
                                            <label class="form-check-label" th:for="'cat_' + ${child.id}"
                                                   th:text="${child.name}">子分类</label>
                                        </div>
                                    </div>
                                </th:block>
                            </div>
                        </div>

                        <!-- Tags -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3" th:text="#{product.tags}">Tags</h6>
                            <div style="max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 6px; padding: 12px;">
                                <div class="form-check" th:each="tag : ${tags}">
                                    <input class="form-check-input" type="checkbox" name="tagIds"
                                           th:value="${tag.id}" th:id="'tag_' + ${tag.id}"
                                           th:checked="${product.tags != null and #lists.contains(product.tags.![id], tag.id)}">
                                    <label class="form-check-label" th:for="'tag_' + ${tag.id}"
                                           th:text="${tag.name}">Tag</label>
                                </div>
                                <p th:if="${tags == null or tags.isEmpty()}" class="text-muted mb-0">暂无标签。</p>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> <span th:text="#{admin.save}">保存</span>
                            </button>
                            <a href="/admin/products" class="btn btn-outline-secondary" th:text="#{admin.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 图片 Picker Modal -->
<div class="modal fade" id="imagePickerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">选择图片</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Tab -->
                <ul class="nav nav-tabs mb-3">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" href="#tabLibrary">图片库</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#tabUpload">上传新图片</a>
                    </li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="tabLibrary">
                        <!-- Search bar for image picker -->
                        <div class="d-flex gap-2 mb-3">
                            <input type="text" id="pickerSearchInput" class="form-control form-control-sm" placeholder="按文件名搜索...">
                            <button type="button" id="pickerSearchBtn" class="btn btn-primary btn-sm">搜索</button>
                        </div>
                        <div id="imagePickerGrid" class="image-picker-grid">
                            <p class="text-muted text-center py-4">加载中...</p>
                        </div>
                        <!-- Pagination for image picker -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <small class="text-muted" id="pickerPageInfo"></small>
                            <div class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-outline-secondary" id="pickerPrevPage" disabled>&laquo; 上一页</button>
                                <button type="button" class="btn btn-outline-secondary" id="pickerNextPage" disabled>下一页 &raquo;</button>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="tabUpload">
                        <label class="upload-zone d-block" id="modalUploadZone" for="modalFileInput" style="cursor:pointer;">
                            <i class="bi bi-cloud-arrow-up d-block" style="pointer-events:none;"></i>
                            <p style="pointer-events:none;">点击或拖拽文件至此上传</p>
                            <input type="file" id="modalFileInput" accept="image/*" style="display: none">
                        </label>
                        <div id="uploadProgress" class="mt-2" style="display: none">
                            <div class="progress">
                                <div class="progress-bar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmImageSelect" disabled>确认选择</button>
            </div>
        </div>
    </div>
</div>

<!-- TinyMCE (free self-hosted via jsDelivr CDN, no API key needed) -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>

<!-- Enhanced TinyMCE initialization for product form -->
<script>
(function() {
    // Override the default TinyMCE init from admin.js with enhanced config
    if (typeof tinymce !== 'undefined') {
        // Remove any existing instances first
        tinymce.remove('#shortDescription');
        tinymce.remove('#description');

        // 简短描述 editor (第一部分 - compact)
        tinymce.init({
            selector: '#shortDescription',
            height: 350,
            menubar: false,
            plugins: 'lists link image table code fullscreen preview media hr anchor charmap',
            toolbar: [
                'undo redo | blocks fontsize | bold italic underline strikethrough | forecolor backcolor',
                'alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image media table | hr charmap | code fullscreen'
            ],
            content_style: 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.6; padding: 12px; } img { max-width: 100%; height: auto; }',
            images_upload_handler: tinymceImageUploadHandler,
            file_picker_types: 'image',
            file_picker_callback: tinymceFilePicker,
            promotion: false,
            branding: false,
            convert_urls: false,
            relative_urls: false,
            placeholder: '请输入产品简要介绍，支持图文混排...'
        });

        // 详细描述 editor (第二部分 - full featured)
        tinymce.init({
            selector: '#description',
            height: 550,
            menubar: 'file edit view insert format table',
            plugins: 'lists link image table code fullscreen preview media hr anchor charmap wordcount visualblocks pagebreak',
            toolbar: [
                'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | forecolor backcolor removeformat',
                'alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image media table | hr pagebreak charmap | visualblocks code fullscreen'
            ],
            content_style: 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.8; padding: 16px; max-width: 900px; margin: 0 auto; } img { max-width: 100%; height: auto; border-radius: 4px; } table { border-collapse: collapse; width: 100%; } table td, table th { border: 1px solid #ddd; padding: 8px; }',
            images_upload_handler: tinymceImageUploadHandler,
            file_picker_types: 'image',
            file_picker_callback: tinymceFilePicker,
            promotion: false,
            branding: false,
            convert_urls: false,
            relative_urls: false,
            placeholder: '请输入产品详细介绍，支持插入图片、表格、视频等富文本内容...',
            image_caption: true,
            image_advtab: true,
            table_default_styles: { 'border-collapse': 'collapse', 'width': '100%' },
            table_default_attributes: { border: '1' }
        });
    }

    // 图片 upload handler for TinyMCE
    function tinymceImageUploadHandler(blobInfo) {
        return new Promise(function(resolve, reject) {
            var formData = new FormData();
            formData.append('file', blobInfo.blob(), blobInfo.filename());

            fetch('/admin/api/images/upload', {
                method: 'POST',
                body: formData
            })
            .then(function(resp) { return resp.json(); })
            .then(function(data) {
                if (data.success) {
                    resolve(data.url);
                } else {
                    reject('上传失败: ' + (data.message || '未知错误'));
                }
            })
            .catch(function(err) {
                reject('上传失败: ' + err.message);
            });
        });
    }

    // File picker for selecting images from library
    function tinymceFilePicker(callback, value, meta) {
        if (meta.filetype === 'image') {
            // Use a hidden label+input to avoid browser security restrictions on programmatic .click()
            var input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
            document.body.appendChild(input);
            input.addEventListener('change', function() {
                var file = this.files[0];
                if (!file) { document.body.removeChild(input); return; }
                var formData = new FormData();
                formData.append('file', file);

                fetch('/admin/api/images/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(function(resp) { return resp.json(); })
                .then(function(data) {
                    document.body.removeChild(input);
                    if (data.success) {
                        callback(data.url, { alt: file.name });
                    }
                })
                .catch(function() { document.body.removeChild(input); });
            });
            input.click();
        }
    }

    // Ensure TinyMCE content syncs before form submit
    var form = document.getElementById('productForm');
    if (form) {
        form.addEventListener('submit', function() {
            if (typeof tinymce !== 'undefined') {
                tinymce.triggerSave();
            }
        });
    }
})();
</script>
</body>
</html>
