<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead(${user.id != null} ? '编辑 User' : '新增用户')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;" th:text="${user.id != null} ? '编辑 User' : '新增用户'">User Form</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;" th:text="${user.id != null} ? '更新用户信息和角色分配' : '创建新管理员账号'">Subtitle</p>
                </div>
                <a href="/admin/users" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> 返回
                </a>
            </div>

            <form th:action="@{/admin/users/save}" method="post">
                <input type="hidden" name="id" th:value="${user.id}">

                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="admin-form">
                            <h6 class="mb-3">基本信息</h6>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">用户名 <span class="text-danger">*</span></label>
                                    <input type="text" name="username" class="form-control"
                                           th:value="${user.username}" required
                                           th:readonly="${user.id != null}" placeholder="登录用户名">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">
                                        密码
                                        <span th:if="${user.id == null}" class="text-danger">*</span>
                                        <small th:if="${user.id != null}" class="text-muted">(留空不修改)</small>
                                    </label>
                                    <input type="password" name="password" class="form-control"
                                           th:required="${user.id == null}" placeholder="请输入密码">
                                </div>
                            </div>
                            <div class="row g-3 mt-0">
                                <div class="col-md-6">
                                    <label class="form-label">真实姓名</label>
                                    <input type="text" name="realName" class="form-control"
                                           th:value="${user.realName}" placeholder="真实姓名">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">邮箱</label>
                                    <input type="email" name="email" class="form-control"
                                           th:value="${user.email}" placeholder="邮箱地址">
                                </div>
                            </div>
                            <div class="row g-3 mt-0">
                                <div class="col-md-6">
                                    <label class="form-label">手机号</label>
                                    <input type="text" name="phone" class="form-control"
                                           th:value="${user.phone}" placeholder="手机号码">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">状态</label>
                                    <select name="status" class="form-select">
                                        <option value="1" th:selected="${user.status == null or user.status == 1}">启用</option>
                                        <option value="0" th:selected="${user.status == 0}">禁用</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <!-- 角色 -->
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">分配角色</h6>
                            <div style="max-height: 300px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 6px; padding: 12px;">
                                <div class="form-check" th:each="role : ${roles}">
                                    <input class="form-check-input" type="checkbox" name="roleIds"
                                           th:value="${role.id}" th:id="'role_' + ${role.id}"
                                           th:checked="${user.roles != null and #lists.contains(user.roles.![id], role.id)}">
                                    <label class="form-check-label" th:for="'role_' + ${role.id}">
                                        <strong th:text="${role.displayName}">Admin</strong>
                                        <br>
                                        <small class="text-muted" th:text="${role.description}">描述</small>
                                    </label>
                                </div>
                                <p th:if="${roles == null or roles.isEmpty()}" class="text-muted mb-0">暂无角色</p>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> 保存
                            </button>
                            <a href="/admin/users" class="btn btn-outline-secondary">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
