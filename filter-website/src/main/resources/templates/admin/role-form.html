<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead(${role.id != null} ? '编辑角色' : '新增角色')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;" th:text="${role.id != null} ? '编辑角色' : '新增角色'">角色表单</h4>
                </div>
                <a href="/admin/roles" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> 返回
                </a>
            </div>

            <form th:action="@{/admin/roles/save}" method="post">
                <input type="hidden" name="id" th:value="${role.id}">

                <div class="row g-4">
                    <div class="col-lg-5">
                        <div class="admin-form">
                            <h6 class="mb-3">角色信息</h6>
                            <div class="mb-3">
                                <label class="form-label">角色标识 <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control"
                                       th:value="${role.name}" required
                                       placeholder="如: EDITOR, OPERATOR（大写英文）">
                                <small class="text-muted">用于系统内部标识，如 ADMIN, OPERATOR</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">角色名称 <span class="text-danger">*</span></label>
                                <input type="text" name="displayName" class="form-control"
                                       th:value="${role.displayName}" required
                                       placeholder="如: 编辑人员、运营人员">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">描述</label>
                                <textarea name="description" class="form-control" rows="3"
                                          th:text="${role.description}" placeholder="角色描述"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="admin-form">
                            <h6 class="mb-3">分配权限</h6>
                            <div class="permission-module-list">
                                <div th:each="entry : ${permissionMap}" class="permission-module mb-3">
                                    <div class="d-flex align-items-center mb-2">
                                        <strong class="text-capitalize" th:text="${entry.key}">模块</strong>
                                        <button type="button" class="btn btn-link btn-sm ms-2 select-all-btn"
                                                th:data-module="${entry.key}" onclick="toggleModulePerms(this)">
                                            全选
                                        </button>
                                    </div>
                                    <div class="d-flex flex-wrap gap-2 ms-2">
                                        <div class="form-check" th:each="perm : ${entry.value}">
                                            <input class="form-check-input" type="checkbox" name="permissionIds"
                                                   th:value="${perm.id}"
                                                   th:id="'perm_' + ${perm.id}"
                                                   th:data-module="${entry.key}"
                                                   th:checked="${role.permissions != null and #lists.contains(role.permissions.![id], perm.id)}">
                                            <label class="form-check-label" th:for="'perm_' + ${perm.id}"
                                                   th:text="${perm.displayName}">权限</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> 保存
                            </button>
                            <a href="/admin/roles" class="btn btn-outline-secondary">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>

<script>
    function toggleModulePerms(btn) {
        var module = btn.getAttribute('data-module');
        var checkboxes = document.querySelectorAll('input[data-module="' + module + '"]');
        var allChecked = Array.from(checkboxes).every(function(cb) { return cb.checked; });
        checkboxes.forEach(function(cb) { cb.checked = !allChecked; });
        btn.textContent = allChecked ? '全选' : '取消全选';
    }
</script>
</body>
</html>
