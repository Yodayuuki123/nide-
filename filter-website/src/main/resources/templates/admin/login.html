<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 菲利特管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css?v=2">
    <style>
        *, body { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif !important; }
        body { -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-filter-circle-fill"></i>
            <h4>PHILITEE</h4>
            <p class="mb-0">管理后台</p>
        </div>

        <!-- 错误提示 -->
        <div class="alert alert-danger" th:if="${param.error}">
            <i class="bi bi-exclamation-circle"></i> 用户名或密码错误，请重试。
        </div>

        <!-- 退出提示 -->
        <div class="alert alert-success" th:if="${param.logout}">
            <i class="bi bi-check-circle"></i> 您已成功退出登录。
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="请输入用户名" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">密码</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                登 录
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/" style="color: var(--admin-text-tertiary); font-size: 12px; letter-spacing: 0.04em; text-decoration: none;">
                <i class="bi bi-arrow-left"></i> 返回前台
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
