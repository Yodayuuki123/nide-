<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Login - ' + #{admin.title}">Login - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-filter-circle-fill"></i>
            <h4>Philitee</h4>
            <p class="mb-0">Administration Panel</p>
        </div>

        <!-- Error Message -->
        <div class="alert alert-danger" th:if="${param.error}">
            <i class="bi bi-exclamation-circle"></i> Invalid username or password.
        </div>

        <!-- Logout Message -->
        <div class="alert alert-success" th:if="${param.logout}">
            <i class="bi bi-check-circle"></i> You have been logged out.
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                Sign In
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/" style="color: var(--admin-text-tertiary); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; text-decoration: none;">
                <i class="bi bi-arrow-left"></i> Back to Website
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
