<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead(#{admin.categories})}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash 留言内容s -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;" th:text="#{admin.categories}">所属分类</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">Organize your products with categories</p>
                </div>
                <a href="/admin/categories/add" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> <span th:text="#{admin.add}">新增</span>
                </a>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>All 所属分类</h5>
                </div>
                <div class="admin-card-body">
                    <div class="table-responsive">
                        <table class="table admin-table mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>URL别名</th>
                                <th>父级</th>
                                <th>产品数</th>
                                <th>创建时间</th>
                                <th th:text="#{admin.actions}">操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Top-level categories -->
                            <th:block th:each="cat : ${categoryTree}">
                                <tr>
                                    <td th:text="${cat.id}">1</td>
                                    <td>
                                        <strong>
                                            <i class="bi bi-folder2 text-primary me-1"></i>
                                            <span th:text="${cat.name}">Category</span>
                                        </strong>
                                    </td>
                                    <td class="text-muted" th:text="${cat.slug}">slug</td>
                                    <td class="text-muted">—</td>
                                    <td>
                                        <span class="badge bg-light text-dark" th:text="${cat.productCount} ?: 0">0</span>
                                    </td>
                                    <td class="text-muted" th:text="${cat.createdAt != null} ? ${#temporals.format(cat.createdAt, 'yyyy-MM-dd')} : '-'">2026-01-01</td>
                                    <td class="actions">
                                        <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                                           class="btn btn-sm btn-outline-primary me-1" title="编辑">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button" class="btn btn-sm btn-outline-danger"
                                                th:data-id="${cat.id}"
                                                th:data-name="${cat.name}"
                                                data-bs-toggle="modal" data-bs-target="#deleteModal"
                                                onclick="prepare删除(this)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                                <!-- Child categories -->
                                <tr th:each="child : ${cat.children}" class="table-light">
                                    <td th:text="${child.id}">2</td>
                                    <td style="padding-left: 2.5rem;">
                                        <i class="bi bi-arrow-return-right text-muted me-1"></i>
                                        <span th:text="${child.name}">子分类</span>
                                    </td>
                                    <td class="text-muted" th:text="${child.slug}">slug</td>
                                    <td class="text-muted" th:text="${cat.name}">父级</td>
                                    <td>
                                        <span class="badge bg-light text-dark" th:text="${child.productCount} ?: 0">0</span>
                                    </td>
                                    <td class="text-muted" th:text="${child.createdAt != null} ? ${#temporals.format(child.createdAt, 'yyyy-MM-dd')} : '-'">2026-01-01</td>
                                    <td class="actions">
                                        <a th:href="@{/admin/categories/edit/{id}(id=${child.id})}"
                                           class="btn btn-sm btn-outline-primary me-1" title="编辑">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button" class="btn btn-sm btn-outline-danger"
                                                th:data-id="${child.id}"
                                                th:data-name="${child.name}"
                                                data-bs-toggle="modal" data-bs-target="#deleteModal"
                                                onclick="prepare删除(this)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </th:block>
                            <tr th:if="${categoryTree == null or categoryTree.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">暂无分类数据。</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 删除 Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm 删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p th:text="#{admin.confirm_delete}">确定要删除此项目吗？此操作不可撤销。</p>
                <p class="fw-medium" id="deleteItem名称"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{admin.cancel}">取消</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger" th:text="#{admin.delete}">删除</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function prepare删除(btn) {
        document.getElementById('deleteItem名称').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteForm').action = '/admin/categories/delete/' + btn.getAttribute('data-id');
    }
</script>
</body>
</html>
