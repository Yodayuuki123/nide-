<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead(#{admin.products})}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <!-- Flash Messages -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;" th:text="#{admin.products}">Products</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">Manage your product catalog</p>
                </div>
                <a href="/admin/products/add" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> <span th:text="#{admin.add}">Add New</span>
                </a>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h5>All Products</h5>
                </div>
                <div class="admin-card-body">
                    <div class="table-responsive">
                        <table class="table admin-table mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>SKU</th>
                                <th>Status</th>
                                <th>Categories</th>
                                <th>Created</th>
                                <th th:text="#{admin.actions}">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="product : ${productPage.records}">
                                <td th:text="${product.id}">1</td>
                                <td>
                                    <img th:if="${product.mainImage != null}"
                                         th:src="${product.mainImage.url}"
                                         th:alt="${product.name}"
                                         class="thumb-img">
                                    <div th:unless="${product.mainImage != null}"
                                         class="thumb-img placeholder-img d-inline-flex">
                                        <i class="bi bi-image text-muted"></i>
                                    </div>
                                </td>
                                <td>
                                    <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                                       th:text="${product.name}" class="fw-medium">Product Name</a>
                                </td>
                                <td th:text="${product.sku} ?: '-'" class="text-muted">SKU</td>
                                <td>
                                    <span class="badge status-badge"
                                          th:classappend="${product.status == 'publish'} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${product.status}">publish</span>
                                </td>
                                <td>
                                    <span th:each="cat,iter : ${product.categories}"
                                          th:if="${iter.index < 2}">
                                        <span class="badge" style="background: var(--admin-bg-secondary); color: var(--admin-text-secondary);" th:text="${cat.name}">Cat</span>
                                    </span>
                                    <span th:if="${product.categories != null and product.categories.size() > 2}"
                                          class="text-muted">+<span th:text="${product.categories.size() - 2}">1</span></span>
                                </td>
                                <td class="text-muted" th:text="${product.createdAt != null} ? ${#temporals.format(product.createdAt, 'yyyy-MM-dd')} : '-'">2026-01-01</td>
                                <td class="actions">
                                    <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                                       class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:data-id="${product.id}"
                                            th:data-name="${product.name}"
                                            data-bs-toggle="modal" data-bs-target="#deleteModal"
                                            onclick="prepareDelete(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${productPage.records.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">No products found.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="p-3" th:if="${productPage.pages > 1}">
                        <nav>
                            <ul class="pagination mb-0 justify-content-center">
                                <li class="page-item" th:classappend="${productPage.current <= 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/products(page=${productPage.current - 1}, size=${productPage.size})}">Previous</a>
                                </li>
                                <th:block th:each="i : ${#numbers.sequence(1, productPage.pages)}">
                                    <li class="page-item" th:classappend="${i == productPage.current} ? 'active'">
                                        <a class="page-link" th:href="@{/admin/products(page=${i}, size=${productPage.size})}" th:text="${i}">1</a>
                                    </li>
                                </th:block>
                                <li class="page-item" th:classappend="${productPage.current >= productPage.pages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/products(page=${productPage.current + 1}, size=${productPage.size})}">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p th:text="#{admin.confirm_delete}">Are you sure you want to delete this item?</p>
                <p class="fw-medium" id="deleteItemName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{admin.cancel}">Cancel</button>
                <form id="deleteForm" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger" th:text="#{admin.delete}">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    function prepareDelete(btn) {
        document.getElementById('deleteItemName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteForm').action = '/admin/products/delete/' + btn.getAttribute('data-id');
    }
</script>
</body>
</html>
