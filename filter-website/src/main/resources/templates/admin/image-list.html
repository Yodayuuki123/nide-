<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Image Management')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>
    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>
        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">Image Management</h4>
                </div>
            </div>

            <div class="admin-card mb-4">
                <div class="admin-card-body p-4">
                    <label class="upload-zone mb-3" id="pageUploadZone" for="pageFileInput" style="display:block; cursor:pointer;">
                        <i class="bi bi-cloud-arrow-up" style="pointer-events:none;"></i>
                        <h5 style="pointer-events:none;">Select Images</h5>
                        <p class="text-muted mb-0" style="pointer-events:none;">Click or drag files here. Files will be staged before upload.</p>
                        <input type="file" id="pageFileInput" accept="image/*,video/*" multiple style="display: none">
                    </label>

                    <div id="pendingUploadWrap" style="display:none;">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0">Pending Uploads</h6>
                            <button type="button" class="btn btn-primary btn-sm" id="startBatchUploadBtn">Upload Selected</button>
                        </div>
                        <div id="pendingUploadList" class="d-flex flex-wrap gap-2 mb-3"></div>
                    </div>

                    <div id="batchUploadProgress" class="mt-3" style="display:none;">
                        <div class="progress mb-2">
                            <div class="progress-bar" id="batchProgressBar" style="width: 0%"></div>
                        </div>
                        <small class="text-muted" id="batchProgressText">Uploading...</small>
                    </div>
                </div>
            </div>

            <div class="admin-card mb-4">
                <div class="admin-card-body p-3">
                    <form method="get" th:action="@{/admin/images}" class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small mb-1">Image Title</label>
                            <input type="text" name="keyword" class="form-control form-control-sm" th:value="${param.keyword}" placeholder="Search by file name...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small mb-1">Upload From</label>
                            <input type="date" name="startDate" class="form-control form-control-sm" th:value="${param.startDate}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small mb-1">Upload To</label>
                            <input type="date" name="endDate" class="form-control form-control-sm" th:value="${param.endDate}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small mb-1">Per Page</label>
                            <select name="size" class="form-select form-select-sm">
                                <option value="10" th:selected="${imagePage.size == 10}">10</option>
                                <option value="20" th:selected="${imagePage.size == 20}">20</option>
                                <option value="50" th:selected="${imagePage.size == 50}">50</option>
                                <option value="100" th:selected="${imagePage.size == 100}">100</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> Search</button>
                            <a th:href="@{/admin/images}" class="btn btn-outline-secondary btn-sm">Reset</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-card">
                <div class="admin-card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Image Library</h5>
                    <span class="text-muted" th:text="'Total ' + ${imagePage.total}">Total 0</span>
                </div>
                <div class="admin-card-body p-4">
                    <div class="image-grid">
                        <div th:each="img : ${imagePage.records}" class="image-grid-item">
                            <div class="image-grid-thumb">
                                <img th:src="${img.url} ?: ('/wp-content/uploads' + img.filePath)" th:alt="${img.altText} ?: ${img.fileName}">
                            </div>
                            <div class="image-grid-info">
                                <small class="text-truncate d-block" th:text="${img.fileName}">filename.jpg</small>
                                <small class="text-muted" th:text="${img.uploadedAt != null ? #temporals.format(img.uploadedAt, 'yyyy-MM-dd HH:mm') : '-'}">2026-01-01</small>
                            </div>
                            <div class="image-grid-actions">
                                <button type="button" class="btn btn-sm btn-outline-danger" th:data-id="${img.id}" th:data-name="${img.fileName}" onclick="confirmDeleteImage(this)"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>

                    <div th:if="${imagePage.records.isEmpty()}" class="text-center text-muted py-4">
                        <i class="bi bi-image fs-1 d-block mb-2"></i>
                        <p>No images found.</p>
                    </div>

                    <div class="mt-4 d-flex justify-content-between align-items-center" th:if="${imagePage.pages > 1}">
                        <small class="text-muted" th:text="'Showing ' + ${(imagePage.current - 1) * imagePage.size + 1} + '-' + ${imagePage.current * imagePage.size < imagePage.total ? imagePage.current * imagePage.size : imagePage.total} + ' / Total ' + ${imagePage.total}"></small>
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${imagePage.current <= 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/images(page=${imagePage.current - 1}, size=${imagePage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}">Prev</a>
                                </li>
                                <th:block th:with="startPage=${imagePage.current - 2 > 1 ? imagePage.current - 2 : 1}, endPage=${imagePage.pages < (imagePage.current - 2 > 1 ? imagePage.current - 2 : 1) + 4 ? imagePage.pages : (imagePage.current - 2 > 1 ? imagePage.current - 2 : 1) + 4}">
                                    <li th:if="${startPage > 1}" class="page-item"><a class="page-link" th:href="@{/admin/images(page=1, size=${imagePage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}">1</a></li>
                                    <li th:if="${startPage > 2}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                                        <li class="page-item" th:classappend="${i == imagePage.current} ? 'active'">
                                            <a class="page-link" th:href="@{/admin/images(page=${i}, size=${imagePage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}" th:text="${i}">1</a>
                                        </li>
                                    </th:block>
                                    <li th:if="${endPage < imagePage.pages - 1}" class="page-item disabled"><span class="page-link">...</span></li>
                                    <li th:if="${endPage < imagePage.pages}" class="page-item"><a class="page-link" th:href="@{/admin/images(page=${imagePage.pages}, size=${imagePage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}" th:text="${imagePage.pages}">99</a></li>
                                </th:block>
                                <li class="page-item" th:classappend="${imagePage.current >= imagePage.pages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/images(page=${imagePage.current + 1}, size=${imagePage.size}, keyword=${param.keyword}, startDate=${param.startDate}, endDate=${param.endDate})}">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteImageModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this image?</p>
                <p class="fw-medium" id="deleteImageName"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-outline-danger" onclick="doDeleteImage()">Confirm</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
(function() {
    var pendingFiles = [];
    var uploadZone = document.getElementById('pageUploadZone');
    var fileInput = document.getElementById('pageFileInput');
    var pendingWrap = document.getElementById('pendingUploadWrap');
    var pendingList = document.getElementById('pendingUploadList');
    var uploadBtn = document.getElementById('startBatchUploadBtn');
    var progressDiv = document.getElementById('batchUploadProgress');
    var progressBar = document.getElementById('batchProgressBar');
    var progressText = document.getElementById('batchProgressText');

    function renderPendingFiles() {
        pendingList.innerHTML = '';
        pendingWrap.style.display = pendingFiles.length ? '' : 'none';
        pendingFiles.forEach(function(file, index) {
            var item = document.createElement('div');
            item.className = 'border rounded p-2 d-flex align-items-center gap-2';
            item.innerHTML = '<i class="bi bi-image text-success"></i><small class="text-truncate" style="max-width:180px;">' + file.name + '</small><button type="button" class="btn btn-sm btn-outline-danger">&times;</button>';
            item.querySelector('button').addEventListener('click', function() {
                pendingFiles.splice(index, 1);
                renderPendingFiles();
            });
            pendingList.appendChild(item);
        });
    }

    function appendFiles(files) {
        Array.from(files).forEach(function(file) {
            pendingFiles.push(file);
        });
        renderPendingFiles();
    }

    if (uploadZone && fileInput) {
        // label[for] handles click natively; only bind drag events
        uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); uploadZone.classList.add('drag-over'); });
        uploadZone.addEventListener('dragleave', function(e) { e.stopPropagation(); uploadZone.classList.remove('drag-over'); });
        uploadZone.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadZone.classList.remove('drag-over');
            appendFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', function() {
            appendFiles(this.files);
            this.value = '';
        });
    }

    if (uploadBtn) {
        uploadBtn.addEventListener('click', function() {
            if (!pendingFiles.length) return;
            var formData = new FormData();
            pendingFiles.forEach(function(file) { formData.append('files', file); });
            progressDiv.style.display = '';
            progressBar.style.width = '35%';
            progressText.textContent = 'Uploading ' + pendingFiles.length + ' files...';
            fetch('/admin/api/images/batch-upload', { method: 'POST', body: formData })
                .then(function(resp) { return resp.json(); })
                .then(function(data) {
                    progressBar.style.width = '100%';
                    if (data.uploadedCount > 0) {
                        pendingFiles = [];
                        renderPendingFiles();
                        if (typeof showToast === 'function') showToast('Uploaded ' + data.uploadedCount + ' image(s)', 'success');
                        setTimeout(function() { window.location.reload(); }, 800);
                    } else if (typeof showToast === 'function') {
                        showToast('Upload failed', 'error');
                    }
                })
                .catch(function(err) {
                    progressBar.style.width = '100%';
                    if (typeof showToast === 'function') showToast('Upload failed: ' + err.message, 'error');
                });
        });
    }
})();

var deleteImageId = null;
function confirmDeleteImage(btn) {
    deleteImageId = btn.getAttribute('data-id');
    document.getElementById('deleteImageName').textContent = btn.getAttribute('data-name');
    bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteImageModal')).show();
}

function doDeleteImage() {
    if (!deleteImageId) return;
    fetch('/admin/api/images/delete/' + deleteImageId, { method: 'POST' })
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            if (data.success) {
                if (typeof showToast === 'function') showToast('Image deleted successfully', 'success');
                setTimeout(function() { window.location.reload(); }, 500);
            } else if (typeof showToast === 'function') {
                showToast(data.message || 'Delete failed', 'error');
            }
        })
        .catch(function(err) {
            if (typeof showToast === 'function') showToast('Delete failed: ' + err.message, 'error');
        });
}
</script>
</body>
</html>
