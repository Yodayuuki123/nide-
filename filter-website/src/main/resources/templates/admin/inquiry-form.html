<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('编辑询盘')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;">编辑询盘</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;">Update inquiry information</p>
                </div>
                <a href="/admin/inquiries" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.back}">返回</span>
                </a>
            </div>

            <form th:action="@{/admin/inquiries/save}" method="post">
                <input type="hidden" name="id" th:value="${inquiry.id}">

                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">询盘信息</h6>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">名称 <span class="text-danger">*</span></label>
                                        <input type="text" name="name" class="form-control" th:value="${inquiry.name}"
                                               required placeholder="Customer name">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">邮箱 <span class="text-danger">*</span></label>
                                        <input type="email" name="email" class="form-control" th:value="${inquiry.email}"
                                               required placeholder="customer@example.com">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">电话</label>
                                        <input type="text" name="phone" class="form-control" th:value="${inquiry.phone}"
                                               placeholder="Phone number">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">公司</label>
                                        <input type="text" name="company" class="form-control" th:value="${inquiry.company}"
                                               placeholder="Company name">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="mb-3">
                                        <label class="form-label">Product Interest</label>
                                        <input type="text" name="productInterest" class="form-control" th:value="${inquiry.productInterest}"
                                               placeholder="Interested product">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="mb-3">
                                        <label class="form-label">留言内容</label>
                                        <textarea name="message" class="form-control" rows="6"
                                                  placeholder="Customer message" th:text="${inquiry.message}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="admin-form mb-4">
                            <h6 class="mb-3">状态</h6>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" name="isRead" value="true"
                                       id="isRead" th:checked="${inquiry.isRead != null and inquiry.isRead}">
                                <label class="form-check-label" for="isRead">已读</label>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> <span th:text="#{admin.save}">保存</span>
                            </button>
                            <a href="/admin/inquiries" class="btn btn-outline-secondary" th:text="#{admin.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
