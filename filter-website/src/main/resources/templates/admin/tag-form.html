<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead(${tag.id != null} ? '编辑标签' : '新增标签')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;"
                        th:text="${tag.id != null} ? '编辑标签' : '新增标签'">标签表单</h4>
                    <p style="color: var(--admin-text-tertiary); font-size: 13px; margin: 0;"
                       th:text="${tag.id != null} ? '修改标签信息' : '创建新产品标签'">副标题</p>
                </div>
                <a href="/admin/tags" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> 返回
                </a>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <form th:action="@{/admin/tags/save}" method="post" class="admin-form">
                        <input type="hidden" name="id" th:value="${tag.id}">

                        <div class="admin-card mb-3">
                            <div class="admin-card-header"><h6 class="mb-0">基本信息</h6></div>
                            <div class="admin-card-body">
                                <div class="mb-3">
                                    <label class="form-label">标签名称 <span class="text-danger">*</span></label>
                                    <input type="text" name="name" class="form-control" th:value="${tag.name}"
                                           required id="tagName" placeholder="请输入标签名称">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">URL 别名</label>
                                    <input type="text" name="slug" class="form-control" th:value="${tag.slug}"
                                           id="tagSlug" placeholder="留空则自动生成（如：hot-products）">
                                    <div class="form-text">用于 URL，只允许小写字母、数字和连字符</div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> 保存
                            </button>
                            <a href="/admin/tags" class="btn btn-outline-secondary">取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
<script>
    document.getElementById('tagName').addEventListener('input', function() {
        var slugField = document.getElementById('tagSlug');
        if (!slugField.value || slugField.dataset.autoGenerated === 'true') {
            slugField.value = this.value
                .toLowerCase()
                .replace(/[^a-z0-9\u4e00-\u9fa5\s-]/g, '')
                .replace(/[\s]+/g, '-')
                .replace(/-+/g, '-');
            slugField.dataset.autoGenerated = 'true';
        }
    });
    document.getElementById('tagSlug').addEventListener('input', function() {
        this.dataset.autoGenerated = 'false';
    });
</script>
</body>
</html>
