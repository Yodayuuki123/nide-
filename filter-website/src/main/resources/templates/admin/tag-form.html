<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead(${tag.id != null} ? 'Edit Tag' : 'Add Tag')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-layout :: adminSidebar}"></div>

    <div class="admin-content">
        <div th:replace="~{fragments/admin-layout :: adminTopbar}"></div>

        <div class="admin-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 style="font-size: 1.8rem; margin-bottom: 4px;" th:text="${tag.id != null} ? 'Edit Tag' : 'Add Tag'">Tag Form</h4>
                </div>
                <a href="/admin/tags" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{admin.back}">返回</span>
                </a>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <form th:action="@{/admin/tags/save}" method="post" class="admin-form">
                        <input type="hidden" name="id" th:value="${tag.id}">

                        <div class="mb-3">
                            <label class="form-label">Tag Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" th:value="${tag.name}"
                                   required placeholder="Enter tag name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Slug <span class="text-danger">*</span></label>
                            <input type="text" name="slug" class="form-control" th:value="${tag.slug}"
                                   required placeholder="enter-tag-slug">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> <span th:text="#{admin.save}">保存</span>
                            </button>
                            <a href="/admin/tags" class="btn btn-outline-secondary" th:text="#{admin.cancel}">取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
