<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: htmlHead('News', 'Latest news and updates from Philitee Filter')}"></head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>

<!-- Page Header -->
<section class="page-header">
    <div class="aesop-container">
        <h1 class="fade-in">News</h1>
        <p class="fade-in">Latest news, industry insights, and company updates</p>
        <nav class="breadcrumb-nav">
            <a th:href="@{/}">Home</a>
            <span class="separator">/</span>
            <span class="current">News</span>
        </nav>
    </div>
</section>

<section class="section">
    <div class="aesop-container">
        <div class="news-layout">
            <!-- Left: News List -->
            <div class="news-main">
                <!-- Search bar (mobile-visible, also in sidebar on desktop) -->
                <div class="news-search-mobile d-lg-none mb-4">
                    <form th:action="@{/news}" method="get" class="pl-search-form">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search news..." class="form-control">
                        <button type="submit" class="btn btn-accent"><i class="bi bi-search"></i></button>
                    </form>
                </div>

                <!-- Search result indicator -->
                <div th:if="${keyword != null}" class="news-search-info mb-3">
                    <span>Search results for: <strong th:text="${keyword}">keyword</strong></span>
                    <a th:href="@{/news}" class="ms-2"><i class="bi bi-x-circle"></i> Clear</a>
                </div>

                <!-- News Cards Grid -->
                <div th:if="${newsPage != null and !newsPage.records.isEmpty()}" class="news-grid">
                    <a th:each="article : ${newsPage.records}"
                       th:href="@{/news/{slug}(slug=${article.slug})}"
                       class="news-card fade-in">
                        <div class="news-card-img">
                            <img th:if="${article.coverImage != null}"
                                 th:src="${article.coverImage.url}"
                                 th:alt="${article.title}" loading="lazy">
                            <div th:unless="${article.coverImage != null}" class="news-card-placeholder">
                                <i class="bi bi-newspaper"></i>
                            </div>
                        </div>
                        <div class="news-card-body">
                            <div class="news-card-date">
                                <i class="bi bi-calendar3"></i>
                                <span th:text="${article.publishedAt != null} ? ${#temporals.format(article.publishedAt, 'MMM dd, yyyy')} : ${#temporals.format(article.createdAt, 'MMM dd, yyyy')}">Jan 01, 2026</span>
                            </div>
                            <h5 class="news-card-title" th:text="${article.title}">News Title</h5>
                            <p class="news-card-summary" th:if="${article.summary != null}" th:text="${article.summary}">Summary text...</p>
                            <span class="news-read-more">Read More <i class="bi bi-arrow-right"></i></span>
                        </div>
                    </a>
                </div>

                <!-- Empty State -->
                <div th:if="${newsPage == null or newsPage.records.isEmpty()}" class="empty-state">
                    <i class="bi bi-newspaper"></i>
                    <h4>No news articles found</h4>
                    <p th:if="${keyword != null}">Try a different search term</p>
                </div>

                <!-- Pagination -->
                <div th:if="${newsPage != null and newsPage.getPages() > 1}" class="news-pagination">
                    <nav>
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${newsPage.current == 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/news(page=${newsPage.current - 1}, keyword=${keyword})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>
                            <th:block th:each="i : ${#numbers.sequence(1, newsPage.getPages())}">
                                <li class="page-item" th:classappend="${i == newsPage.current} ? 'active'">
                                    <a class="page-link" th:href="@{/news(page=${i}, keyword=${keyword})}" th:text="${i}">1</a>
                                </li>
                            </th:block>
                            <li class="page-item" th:classappend="${newsPage.current == newsPage.getPages()} ? 'disabled'">
                                <a class="page-link" th:href="@{/news(page=${newsPage.current + 1}, keyword=${keyword})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

            <!-- Right Sidebar -->
            <aside class="news-sidebar">
                <!-- Search -->
                <div class="pl-sidebar-widget">
                    <h5 class="pl-widget-title">Search News</h5>
                    <form th:action="@{/news}" method="get" class="pl-search-form">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search..." class="form-control">
                        <button type="submit" class="btn btn-accent"><i class="bi bi-search"></i></button>
                    </form>
                </div>

                <!-- Recent News -->
                <div class="pl-sidebar-widget" th:if="${recentNews != null and !recentNews.isEmpty()}">
                    <h5 class="pl-widget-title">Recent News</h5>
                    <ul class="news-recent-list">
                        <li th:each="item : ${recentNews}">
                            <a th:href="@{/news/{slug}(slug=${item.slug})}">
                                <div class="news-recent-img" th:if="${item.coverImage != null}">
                                    <img th:src="${item.coverImage.url}" th:alt="${item.title}">
                                </div>
                                <div class="news-recent-info">
                                    <span class="news-recent-title" th:text="${item.title}">Title</span>
                                    <span class="news-recent-date"
                                          th:text="${item.publishedAt != null} ? ${#temporals.format(item.publishedAt, 'MMM dd, yyyy')} : ''">Date</span>
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
