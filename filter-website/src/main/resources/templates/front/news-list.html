<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: htmlHead('News', 'Latest news and updates')}"></head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>

<!-- Breadcrumb -->
<div th:replace="~{fragments/breadcrumb :: breadcrumb(${breadcrumbItems})}"></div>



<!-- News Grid -->
<section class="bf-news-section">
    <div class="bf-container">
        <!-- Search & Date Filter (swapped: date first, keyword last) -->
        <form method="get" th:action="@{/news}" style="margin-bottom:24px;">
            <div style="display:flex;align-items:center;gap:0;border:1px solid #ddd;border-radius:4px;overflow:hidden;background:#fff;">
                <div style="display:flex;align-items:center;padding:0 12px;border-right:1px solid #ddd;">
                    <label style="font-size:13px;font-weight:600;color:#e53e3e;margin-right:8px;white-space:nowrap;font-family:var(--font-body);">Start Date</label>
                    <input type="date" name="startDate" th:value="${startDate}"
                           style="padding:10px 8px;border:none;font-size:14px;font-family:var(--font-body);outline:none;min-width:140px;">
                </div>
                <div style="display:flex;align-items:center;padding:0 12px;border-right:1px solid #ddd;">
                    <label style="font-size:13px;font-weight:600;color:#38a169;margin-right:8px;white-space:nowrap;font-family:var(--font-body);">End Date</label>
                    <input type="date" name="endDate" th:value="${endDate}"
                           style="padding:10px 8px;border:none;font-size:14px;font-family:var(--font-body);outline:none;min-width:140px;">
                </div>
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search news..."
                       style="flex:1;min-width:180px;padding:12px 16px;border:none;border-right:1px solid #ddd;font-size:14px;font-family:var(--font-body);outline:none;">
                <input type="hidden" name="sort" th:value="${sort}">
                <button type="submit" style="padding:12px 20px;background:#2d6a4f;color:#fff;border:none;font-size:14px;font-family:var(--font-body);cursor:pointer;white-space:nowrap;flex-shrink:0;">
                    <i class="bi bi-search"></i> Search
                </button>
            </div>
        </form>

        <!-- Search info -->
        <div th:if="${keyword != null and keyword != ''}" class="bf-search-info">
            <span th:text="#{search.results_for}">Search results for:</span> "<strong th:text="${keyword}"></strong>"
            <a th:href="@{/news}" class="bf-clear-search"><i class="bi bi-x-circle"></i> <span th:text="#{news.clear}">Clear</span></a>
        </div>

        <div class="bf-news-grid">
            <a th:each="article : ${newsPage.records}"
               th:href="@{/news/{slug}(slug=${article.slug})}"
               class="bf-news-card">
                <div class="bf-news-card-img">
                    <img th:if="${article.coverImage != null and article.coverImage != ''}"
                         th:src="${article.coverImage}" th:alt="${article.title}" loading="lazy">
                    <div th:unless="${article.coverImage != null and article.coverImage != ''}" class="bf-news-card-placeholder">
                        <i class="bi bi-newspaper"></i>
                    </div>
                </div>
                <div class="bf-news-card-info">
                    <h3 class="bf-news-card-title" th:text="${article.title}">News Title</h3>
                    <span class="bf-news-card-date" th:text="${#temporals.format(article.createdTime, 'yyyy/ MM-dd')}">2025/ 11-06</span>
                </div>
            </a>
        </div>

        <!-- Empty State -->
        <div th:if="${newsPage == null or newsPage.records.isEmpty()}" class="bf-empty-state">
            <i class="bi bi-newspaper" style="font-size:3rem;color:#ccc;"></i>
            <h4 th:text="#{news.empty}">No news articles found</h4>
            <p th:if="${keyword != null}" th:text="#{news.empty.hint}">Try a different search term</p>
        </div>

        <!-- Pagination -->
        <div th:if="${newsPage != null and newsPage.getPages() > 1}" class="bf-pagination">
            <a th:if="${newsPage.current > 1}"
               th:href="@{/news(page=${newsPage.current - 1}, keyword=${keyword}, startDate=${startDate}, endDate=${endDate}, sort=${sort})}"
               class="bf-page-link"><span th:text="'&laquo; ' + #{pagination.previous}">&laquo; Prev</span></a>
            <th:block th:each="i : ${#numbers.sequence(1, newsPage.getPages())}">
                <a th:href="@{/news(page=${i}, keyword=${keyword}, startDate=${startDate}, endDate=${endDate}, sort=${sort})}"
                   th:text="${i}"
                   th:classappend="${i == newsPage.current} ? ' active'"
                   class="bf-page-link">1</a>
            </th:block>
            <a th:if="${newsPage.current < newsPage.getPages()}"
               th:href="@{/news(page=${newsPage.current + 1}, keyword=${keyword}, startDate=${startDate}, endDate=${endDate}, sort=${sort})}"
               class="bf-page-link"><span th:text="#{pagination.next} + ' &raquo;'">Next &raquo;</span></a>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
