<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: htmlHead(#{contact.title}, #{contact.subtitle})}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<!-- Page Hero -->
<section class="page-hero">
    <div class="container">
        <h1 th:text="#{contact.title}">Contact Us</h1>
        <p th:text="#{contact.subtitle}">Get in touch with us for any inquiries</p>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/" th:text="#{breadcrumb.home}">Home</a></li>
                <li class="breadcrumb-item active" th:text="#{contact.title}">Contact Us</li>
            </ol>
        </nav>
    </div>
</section>

<section class="section-padding">
    <div class="container">
        <!-- Success Message -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="#{contact.form.success}">Thank you! We will get back to you soon.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-5">
            <!-- Contact Form -->
            <div class="col-lg-7">
                <div class="contact-form-wrapper p-4 bg-white rounded shadow-sm">
                    <h4 class="mb-4">Send Us a Message</h4>
                    <form th:action="@{/contact}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{contact.form.name}">Your Name</label>
                                <input type="text" name="name" class="form-control" required
                                       th:placeholder="#{contact.form.name}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{contact.form.email}">Email Address</label>
                                <input type="email" name="email" class="form-control" required
                                       th:placeholder="#{contact.form.email}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{contact.form.phone}">Phone Number</label>
                                <input type="text" name="phone" class="form-control"
                                       th:placeholder="#{contact.form.phone}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{contact.form.company}">Company Name</label>
                                <input type="text" name="company" class="form-control"
                                       th:placeholder="#{contact.form.company}">
                            </div>
                            <div class="col-12">
                                <label class="form-label" th:text="#{contact.form.product}">Product Interest</label>
                                <input type="text" name="productInterest" class="form-control"
                                       placeholder="e.g. Filter Bags, Filter Cloth, Filter Cartridges">
                            </div>
                            <div class="col-12">
                                <label class="form-label" th:text="#{contact.form.message}">Message</label>
                                <textarea name="message" class="form-control" rows="5" required
                                          th:placeholder="#{contact.form.message}"></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-accent btn-lg">
                                    <i class="bi bi-send"></i> <span th:text="#{contact.form.submit}">Send Message</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Contact Info -->
            <div class="col-lg-5">
                <div class="contact-info-card p-4 bg-white rounded shadow-sm mb-4">
                    <h4 class="mb-4" th:text="#{contact.info.title}">Get in Touch</h4>

                    <div class="contact-info-item d-flex mb-4">
                        <div class="contact-info-icon me-3">
                            <i class="bi bi-geo-alt fs-4 text-primary"></i>
                        </div>
                        <div>
                            <h6 th:text="#{footer.address}">Address</h6>
                            <p class="text-muted mb-0">Zhejiang Province, China</p>
                        </div>
                    </div>

                    <div class="contact-info-item d-flex mb-4">
                        <div class="contact-info-icon me-3">
                            <i class="bi bi-envelope fs-4 text-primary"></i>
                        </div>
                        <div>
                            <h6 th:text="#{footer.email}">Email</h6>
                            <p class="text-muted mb-0">
                                <a href="mailto:info@philitee.com">info@philitee.com</a>
                            </p>
                        </div>
                    </div>

                    <div class="contact-info-item d-flex mb-4">
                        <div class="contact-info-icon me-3">
                            <i class="bi bi-telephone fs-4 text-primary"></i>
                        </div>
                        <div>
                            <h6 th:text="#{footer.phone}">Phone</h6>
                            <p class="text-muted mb-0">+86 xxx xxxx xxxx</p>
                        </div>
                    </div>

                    <div class="contact-info-item d-flex mb-4">
                        <div class="contact-info-icon me-3">
                            <i class="bi bi-whatsapp fs-4 text-success"></i>
                        </div>
                        <div>
                            <h6 th:text="#{contact.whatsapp}">WhatsApp</h6>
                            <p class="text-muted mb-0">+86 xxx xxxx xxxx</p>
                        </div>
                    </div>

                    <div class="contact-info-item d-flex">
                        <div class="contact-info-icon me-3">
                            <i class="bi bi-wechat fs-4 text-success"></i>
                        </div>
                        <div>
                            <h6 th:text="#{contact.wechat}">WeChat</h6>
                            <p class="text-muted mb-0">philitee_filter</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
