<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/header :: htmlHead(${currentCategory != null} ? ${currentCategory.name} : 'Products', ${currentCategory != null} ? ${currentCategory.description} : 'Philitee Filter Products')}"></head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>

<!-- Breadcrumb -->
<div th:replace="~{fragments/breadcrumb :: breadcrumb(${breadcrumbItems})}"></div>



<section class="bf-product-list-page">
    <div class="bf-container">
        <!-- Child Categories Pills -->
        <div th:if="${childCategories != null and !childCategories.isEmpty()}" class="bf-child-categories">
            <a th:each="child : ${childCategories}"
               th:href="@{/categories/{slug}(slug=${child.slug})}"
               class="bf-child-pill">
                <span th:text="${child.name}">Sub Category</span>
                <span th:if="${child.productCount != null}" class="bf-pill-count" th:text="${child.productCount}">5</span>
            </a>
        </div>

        <div class="bf-pl-layout bf-pl-layout-new">
            <!-- Left: Product Content -->
            <div class="bf-pl-main">
                <!-- Toolbar: result count + view toggle + page size -->
                <div class="bf-pl-toolbar" th:if="${productPage != null}">
                    <div class="bf-pl-toolbar-left">
                        <span th:text="#{pagination.showing}">Showing</span>
                        <strong th:text="${productPage.total}">0</strong>
                        <span th:text="#{pagination.results}">results</span>
                    </div>
                    <div class="bf-pl-toolbar-right">
                        <div class="bf-view-toggle">
                            <button class="bf-view-btn active" data-cols="4" onclick="setGridCols(4, this)" title="Grid view">
                                <i class="bi bi-grid-3x3-gap"></i>
                            </button>
                            <button class="bf-view-btn" data-cols="2" onclick="setGridCols(2, this)" title="2 columns">
                                <i class="bi bi-grid"></i>
                            </button>
                            <button class="bf-view-btn" data-cols="1" onclick="setGridCols(1, this)" title="List view">
                                <i class="bi bi-list-ul"></i>
                            </button>
                        </div>
                        <select class="bf-page-size" onchange="changePageSize(this.value)">
                            <option value="16" th:selected="${productPage.size == 16}" th:text="'16 / ' + #{pagination.per_page}">16 / page</option>
                            <option value="32" th:selected="${productPage.size == 32}" th:text="'32 / ' + #{pagination.per_page}">32 / page</option>
                            <option value="48" th:selected="${productPage.size == 48}" th:text="'48 / ' + #{pagination.per_page}">48 / page</option>
                        </select>
                    </div>
                </div>

                <!-- Product Grid (Paged) -->
                <div th:if="${productPage != null}" class="bf-pl-grid bf-pl-grid-4" id="productGrid">
                    <a th:each="product,iter : ${productPage.records}"
                       th:href="@{/products/{slug}(slug=${product.slug})}"
                       class="bf-product-card">
                        <div class="bf-product-img">
                            <img th:if="${product.mainImage != null}" th:src="${product.mainImage.url}" th:alt="${product.name}" loading="lazy">
                            <div th:unless="${product.mainImage != null}" class="bf-product-placeholder">
                                <i class="bi bi-image"></i>
                            </div>
                        </div>
                        <div class="bf-product-info">
                            <span class="bf-product-tags"
                                  th:if="${product.categories != null and !product.categories.isEmpty()}">
                                <th:block th:each="cat,catIter : ${product.categories}" th:if="${catIter.index < 2}">
                                    <span class="bf-tag" th:text="${cat.name}">Category</span>
                                </th:block>
                            </span>
                            <h6 class="bf-product-title" th:text="${product.name}">Product Name</h6>
                            <span class="bf-product-tags"
                                  th:if="${product.tags != null and !product.tags.isEmpty()}">
                                <th:block th:each="tag,tagIter : ${product.tags}" th:if="${tagIter.index < 3}">
                                    <span class="bf-tag bf-tag-outline" th:text="${tag.name}">Tag</span>
                                </th:block>
                            </span>
                        </div>
                    </a>
                </div>

                <!-- Empty State -->
                <div th:if="${productPage != null and productPage.records.isEmpty()}" class="bf-empty-state">
                    <i class="bi bi-inbox"></i>
                    <h4 th:text="#{search.no_results}">No products found</h4>
                    <p th:text="#{search.try_again}">Try browsing our categories</p>
                    <a th:href="@{/products}" class="bf-btn bf-btn-primary" th:text="#{nav.view_all_products}">Browse All Products</a>
                </div>

                <!-- Product Grid (Non-paged, for tags) -->
                <div th:if="${productPage == null and products != null}" class="bf-pl-grid bf-pl-grid-4" id="productGrid">
                    <a th:each="product,iter : ${products}"
                       th:href="@{/products/{slug}(slug=${product.slug})}"
                       class="bf-product-card">
                        <div class="bf-product-img">
                            <img th:if="${product.mainImage != null}" th:src="${product.mainImage.url}" th:alt="${product.name}" loading="lazy">
                            <div th:unless="${product.mainImage != null}" class="bf-product-placeholder">
                                <i class="bi bi-image"></i>
                            </div>
                        </div>
                        <div class="bf-product-info">
                            <span class="bf-product-tags"
                                  th:if="${product.categories != null and !product.categories.isEmpty()}">
                                <th:block th:each="cat,catIter : ${product.categories}" th:if="${catIter.index < 2}">
                                    <span class="bf-tag" th:text="${cat.name}">Category</span>
                                </th:block>
                            </span>
                            <h6 class="bf-product-title" th:text="${product.name}">Product Name</h6>
                            <span class="bf-product-tags"
                                  th:if="${product.tags != null and !product.tags.isEmpty()}">
                                <th:block th:each="tag,tagIter : ${product.tags}" th:if="${tagIter.index < 3}">
                                    <span class="bf-tag bf-tag-outline" th:text="${tag.name}">Tag</span>
                                </th:block>
                            </span>
                        </div>
                    </a>
                </div>

                <!-- Pagination (max 5 page numbers) -->
                <div th:if="${productPage != null and productPage.pages > 1}" class="bf-pagination-wrap">
                    <nav class="bf-pagination"
                         th:with="totalPages=${productPage.pages},
                                  curPage=${productPage.current},
                                  startPage=${curPage - 2 > 0 ? curPage - 2 : 1},
                                  endPage=${startPage + 4 < totalPages ? startPage + 4 : totalPages},
                                  finalStart=${endPage - 4 > 0 ? endPage - 4 : 1}">
                        <!-- Previous -->
                        <a th:if="${curPage > 1}"
                           th:href="${currentCategory != null} ? @{/categories/{slug}(slug=${currentCategory.slug}, page=${curPage - 1}, size=${productPage.size})} : @{/products(page=${curPage - 1}, size=${productPage.size})}"
                           class="bf-page-link">&laquo;</a>
                        <!-- First + ellipsis -->
                        <a th:if="${finalStart > 1}"
                           th:href="${currentCategory != null} ? @{/categories/{slug}(slug=${currentCategory.slug}, page=1, size=${productPage.size})} : @{/products(page=1, size=${productPage.size})}"
                           class="bf-page-link">1</a>
                        <span th:if="${finalStart > 2}" class="bf-page-link bf-page-ellipsis">&hellip;</span>
                        <!-- Page range (max 5) -->
                        <th:block th:each="i : ${#numbers.sequence(finalStart, endPage)}">
                            <span th:if="${i == curPage}" class="bf-page-link bf-page-active" th:text="${i}">1</span>
                            <a th:unless="${i == curPage}"
                               th:href="${currentCategory != null} ? @{/categories/{slug}(slug=${currentCategory.slug}, page=${i}, size=${productPage.size})} : @{/products(page=${i}, size=${productPage.size})}"
                               class="bf-page-link" th:text="${i}">1</a>
                        </th:block>
                        <!-- Ellipsis + last -->
                        <span th:if="${endPage < totalPages - 1}" class="bf-page-link bf-page-ellipsis">&hellip;</span>
                        <a th:if="${endPage < totalPages}"
                           th:href="${currentCategory != null} ? @{/categories/{slug}(slug=${currentCategory.slug}, page=${totalPages}, size=${productPage.size})} : @{/products(page=${totalPages}, size=${productPage.size})}"
                           class="bf-page-link" th:text="${totalPages}">99</a>
                        <!-- Next -->
                        <a th:if="${curPage < totalPages}"
                           th:href="${currentCategory != null} ? @{/categories/{slug}(slug=${currentCategory.slug}, page=${curPage + 1}, size=${productPage.size})} : @{/products(page=${curPage + 1}, size=${productPage.size})}"
                           class="bf-page-link">&raquo;</a>
                    </nav>
                </div>
            </div>            <div th:replace="~{fragments/sidebar :: productSidebar(${categoryTree != null ? categoryTree : globalCategoryTree}, ${currentCategory})}"></div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/frontend-interactions.js"></script>
<script>
    function changePageSize(size) {
        var url = new URL(window.location);
        url.searchParams.set('size', size);
        url.searchParams.set('page', '1');
        window.location.href = url.toString();
    }

    function setGridCols(cols, btn) {
        var grid = document.getElementById('productGrid');
        if (!grid) return;
        grid.className = 'bf-pl-grid bf-pl-grid-' + cols;
        var btns = document.querySelectorAll('.bf-view-btn');
        btns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        try { localStorage.setItem('plGridCols', cols); } catch(e) {}
    }

    // Restore grid preference
    (function() {
        try {
            var saved = localStorage.getItem('plGridCols');
            if (saved) {
                var grid = document.getElementById('productGrid');
                var btn = document.querySelector('.bf-view-btn[data-cols="' + saved + '"]');
                if (grid && btn) setGridCols(parseInt(saved), btn);
            }
        } catch(e) {}
    })();

    // Sidebar mainCategory hover interaction
    function activateSidebarCat(el) {
        document.querySelectorAll('.bf-maincategory-row').forEach(function(r){ r.classList.remove('active'); });
        document.querySelectorAll('.bf-maincategory-sub-panel').forEach(function(p){ p.classList.remove('active'); });
        el.classList.add('active');
        var idx = el.getAttribute('data-index');
        var panel = document.getElementById('sidecatsub-' + idx);
        if (panel) panel.classList.add('active');
    }
    // Auto-activate first or current on load
    (function(){
        var active = document.querySelector('.bf-maincategory-row.active');
        if (!active) active = document.querySelector('.bf-maincategory-row');
        if (active) activateSidebarCat(active);
    })();
</script>
</body>
</html>
