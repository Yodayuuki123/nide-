<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: htmlHead(#{search.title}, #{site.description})}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<!-- Page Hero -->
<section class="page-hero page-hero-sm">
    <div class="container">
        <h1 th:text="#{search.title}">Search Results</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/" th:text="#{breadcrumb.home}">Home</a></li>
                <li class="breadcrumb-item active" th:text="#{search.title}">Search</li>
            </ol>
        </nav>
    </div>
</section>

<section class="section-padding">
    <div class="container">
        <!-- Search Form -->
        <div class="row justify-content-center mb-5">
            <div class="col-lg-8">
                <form action="/search" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" class="form-control form-control-lg"
                           th:value="${keyword}" th:placeholder="#{search.placeholder}" autofocus>
                    <button type="submit" class="btn btn-primary btn-lg px-4">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Results -->
        <div th:if="${keyword != null and !keyword.isEmpty()}">
            <div class="mb-4">
                <h5>
                    <span th:text="#{search.results_for}">Results for</span>
                    "<strong th:text="${keyword}">keyword</strong>"
                    <span th:if="${products != null}" class="text-muted">
                        (<span th:text="${products.size()}">0</span> <span th:text="#{pagination.results}">results</span>)
                    </span>
                </h5>
            </div>

            <!-- Product Grid -->
            <div th:if="${products != null and !products.isEmpty()}" class="row g-4">
                <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
                    <div class="product-card">
                        <a th:href="@{/products/{slug}(slug=${product.slug})}" class="product-card-img">
                            <img th:if="${product.mainImage != null}" th:src="${product.mainImage.url}"
                                 th:alt="${product.name}">
                            <div th:unless="${product.mainImage != null}" class="product-placeholder">
                                <i class="bi bi-image"></i>
                            </div>
                        </a>
                        <div class="product-card-body">
                            <div class="product-card-categories" th:if="${product.categories != null and !product.categories.isEmpty()}">
                                <span th:each="cat,iter : ${product.categories}" th:if="${iter.index < 1}">
                                    <a th:href="@{/categories/{slug}(slug=${cat.slug})}"
                                       th:text="${cat.name}" class="product-card-cat">Category</a>
                                </span>
                            </div>
                            <h6 class="product-card-title">
                                <a th:href="@{/products/{slug}(slug=${product.slug})}"
                                   th:text="${product.name}">Product Name</a>
                            </h6>
                            <div class="product-card-sku" th:if="${product.sku != null}">
                                <small class="text-muted" th:text="'SKU: ' + ${product.sku}">SKU: ABC-123</small>
                            </div>
                        </div>
                        <div class="product-card-footer">
                            <a th:href="@{/products/{slug}(slug=${product.slug})}" class="btn btn-sm btn-outline-primary w-100">
                                <i class="bi bi-eye"></i> <span th:text="#{product.view_detail}">View Details</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- No Results -->
            <div th:if="${products == null or products.isEmpty()}" class="text-center py-5">
                <i class="bi bi-search fs-1 text-muted d-block mb-3"></i>
                <h5 th:text="#{search.no_results}">No products found</h5>
                <p class="text-muted" th:text="#{search.try_again}">Try different keywords or browse our categories</p>
                <a href="/products" class="btn btn-primary mt-2">
                    <i class="bi bi-box-seam"></i> <span th:text="#{breadcrumb.products}">Browse Products</span>
                </a>
            </div>
        </div>

        <!-- No keyword -->
        <div th:if="${keyword == null or keyword.isEmpty()}" class="text-center py-5">
            <i class="bi bi-search fs-1 text-muted d-block mb-3"></i>
            <h5 th:text="#{search.enter_keyword}">Enter a keyword to search</h5>
            <p class="text-muted">Search our catalog of over 2000 filtration products</p>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
