<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: htmlHead(#{search.title}, #{site.description})}"></head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>

<!-- Page Header (Aesop-style) -->
<section class="page-header">
    <div class="aesop-container">
        <h1 th:text="#{search.title}" class="fade-in">Search</h1>
        <nav class="breadcrumb-nav">
            <a th:href="@{/}" th:text="#{breadcrumb.home}">Home</a>
            <span class="separator">/</span>
            <span class="current" th:text="#{search.title}">Search</span>
        </nav>
    </div>
</section>

<section class="section">
    <div class="aesop-container">
        <!-- Search Form (Aesop-style) -->
        <form th:action="@{/search}" method="get" class="search-form-large fade-in">
            <input type="text" name="keyword" th:value="${keyword}" th:placeholder="#{search.placeholder}" autofocus>
            <button type="submit"><i class="bi bi-search"></i></button>
        </form>

        <!-- Results -->
        <div th:if="${keyword != null and !keyword.isEmpty()}">
            <div class="search-result-info fade-in">
                <span th:text="#{search.results_for}">Results for</span>
                &ldquo;<strong th:text="${keyword}">keyword</strong>&rdquo;
                <span th:if="${products != null}">
                    &mdash; <span th:text="${products.size()}">0</span> <span th:text="#{pagination.results}">results</span>
                </span>
            </div>

            <!-- Product Grid -->
            <div th:if="${products != null and !products.isEmpty()}" class="product-grid">
                <a th:each="product,iter : ${products}"
                   th:href="@{/products/{slug}(slug=${product.slug})}"
                   class="product-card fade-in"
                   th:classappend="'stagger-' + ${(iter.index % 6) + 1}">
                    <div class="product-card-image">
                        <img th:if="${product.mainImage != null}" th:src="${product.mainImage.url}" th:alt="${product.name}" loading="lazy">
                        <div th:unless="${product.mainImage != null}" class="product-placeholder">
                            <i class="bi bi-image"></i>
                        </div>
                    </div>
                    <div class="product-card-info">
                        <span class="product-card-category"
                              th:if="${product.categories != null and !product.categories.isEmpty()}"
                              th:text="${product.categories[0].name}">Category</span>
                        <div class="product-card-title" th:text="${product.name}">Product Name</div>
                        <div class="product-card-sku" th:if="${product.sku != null}" th:text="'SKU: ' + ${product.sku}">SKU</div>
                    </div>
                </a>
            </div>

            <!-- No Results -->
            <div th:if="${products == null or products.isEmpty()}" class="empty-state fade-in">
                <i class="bi bi-search"></i>
                <h4 th:text="#{search.no_results}">No products found</h4>
                <p th:text="#{search.try_again}">Try different keywords or browse our categories</p>
                <a th:href="@{/products}" class="btn-aesop" th:text="#{breadcrumb.products}">Browse Products</a>
            </div>
        </div>

        <!-- No Keyword -->
        <div th:if="${keyword == null or keyword.isEmpty()}" class="empty-state fade-in">
            <i class="bi bi-search"></i>
            <h4 th:text="#{search.enter_keyword}">Enter a keyword to search</h4>
            <p>Search our catalog of over 2000 filtration products</p>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
