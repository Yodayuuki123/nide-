<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: htmlHead(${news.title}, ${news.summary})}"></head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>

<!-- Breadcrumb -->
<div class="section-sm" style="padding-bottom:0;">
    <div class="aesop-container">
        <nav class="breadcrumb-nav" style="justify-content:flex-start;">
            <a th:href="@{/}">Home</a>
            <span class="separator">/</span>
            <a th:href="@{/news}">News</a>
            <span class="separator">/</span>
            <span class="current" th:text="${news.title}">Article Title</span>
        </nav>
    </div>
</div>

<section class="section">
    <div class="aesop-container">
        <div class="news-layout">
            <!-- Left: Article Content -->
            <div class="news-main">
                <article class="news-article">
                    <header class="news-article-header">
                        <h1 th:text="${news.title}">Article Title</h1>
                        <div class="news-article-meta">
                            <span class="news-article-date">
                                <i class="bi bi-calendar3"></i>
                                <span th:text="${news.publishedAt != null} ? ${#temporals.format(news.publishedAt, 'MMMM dd, yyyy')} : ${#temporals.format(news.createdAt, 'MMMM dd, yyyy')}">January 01, 2026</span>
                            </span>
                        </div>
                    </header>

                    <!-- Cover Image -->
                    <div class="news-article-cover" th:if="${news.coverImage != null}">
                        <img th:src="${news.coverImage.url}" th:alt="${news.title}">
                    </div>

                    <!-- Article Content -->
                    <div class="news-article-content" th:utext="${news.content}">
                        Article content here...
                    </div>
                </article>

                <!-- Back to News -->
                <div class="news-back">
                    <a th:href="@{/news}" class="btn btn-outline-accent">
                        <i class="bi bi-arrow-left"></i> Back to News
                    </a>
                </div>
            </div>

            <!-- Right Sidebar -->
            <aside class="news-sidebar">
                <!-- Search -->
                <div class="pl-sidebar-widget">
                    <h5 class="pl-widget-title">Search News</h5>
                    <form th:action="@{/news}" method="get" class="pl-search-form">
                        <input type="text" name="keyword" placeholder="Search..." class="form-control">
                        <button type="submit" class="btn btn-accent"><i class="bi bi-search"></i></button>
                    </form>
                </div>

                <!-- Recent News -->
                <div class="pl-sidebar-widget" th:if="${recentNews != null and !recentNews.isEmpty()}">
                    <h5 class="pl-widget-title">Recent News</h5>
                    <ul class="news-recent-list">
                        <li th:each="item : ${recentNews}">
                            <a th:href="@{/news/{slug}(slug=${item.slug})}">
                                <div class="news-recent-img" th:if="${item.coverImage != null}">
                                    <img th:src="${item.coverImage.url}" th:alt="${item.title}">
                                </div>
                                <div class="news-recent-info">
                                    <span class="news-recent-title" th:text="${item.title}">Title</span>
                                    <span class="news-recent-date"
                                          th:text="${item.publishedAt != null} ? ${#temporals.format(item.publishedAt, 'MMM dd, yyyy')} : ''">Date</span>
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>

                <!-- Contact Widget -->
                <div class="pl-sidebar-widget pl-contact-widget">
                    <h5 class="pl-widget-title">Contact Us</h5>
                    <ul class="pl-contact-list">
                        <li><i class="bi bi-envelope"></i> <a href="mailto:info@philiteefilter.com">info@philiteefilter.com</a></li>
                        <li><i class="bi bi-whatsapp"></i> <a href="https://wa.me/8618057358206" target="_blank">+86-18057358206</a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
