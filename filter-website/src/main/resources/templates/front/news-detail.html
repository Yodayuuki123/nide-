<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: htmlHead(${news.title}, ${news.summary})}"></head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>

<!-- Breadcrumb -->
<div th:replace="~{fragments/breadcrumb :: breadcrumb(${breadcrumbItems})}"></div>

<!-- Article Section -->
<section class="bf-article-section">
    <div class="bf-container">
        <div class="bf-article-layout">
            <!-- Left: Article Content -->
            <div class="bf-article-main">
                <article class="bf-article">
                    <h1 class="bf-article-title" th:text="${news.title}">Article Title</h1>
                    <div class="bf-article-meta">
                        <i class="bi bi-clock"></i>
                        <span th:text="${#temporals.format(news.createdTime, 'yyyy/ MM-dd')}">2025/ 11-06</span>
                    </div>

                    <!-- Cover Image -->
                    <div class="bf-article-cover" th:if="${news.coverImage != null and news.coverImage != ''}">
                        <img th:src="${news.coverImage}" th:alt="${news.title}">
                    </div>

                    <!-- Article Content -->
                    <div class="bf-article-content" th:utext="${news.content}">
                        Article content here...
                    </div>
                </article>

                <!-- Previous / Next Post Navigation -->
                <div class="bf-post-nav" th:if="${prevNews != null or nextNews != null}">
                    <a th:if="${prevNews != null}" th:href="@{/news/{slug}(slug=${prevNews.slug})}" class="bf-post-nav-item bf-post-prev">
                        <span class="bf-post-nav-label"><i class="bi bi-arrow-left"></i> Previous Post</span>
                        <span class="bf-post-nav-title" th:text="${prevNews.title}">Previous Title</span>
                    </a>
                    <a th:if="${nextNews != null}" th:href="@{/news/{slug}(slug=${nextNews.slug})}" class="bf-post-nav-item bf-post-next">
                        <span class="bf-post-nav-label">Next Post <i class="bi bi-arrow-right"></i></span>
                        <span class="bf-post-nav-title" th:text="${nextNews.title}">Next Title</span>
                    </a>
                </div>
            </div>

            <!-- Right Sidebar -->
            <aside class="bf-sidebar">
                <div class="bf-sidebar-header">
                    <h3 class="bf-sidebar-title">News</h3>
                </div>

                <!-- Recent News List -->
                <div class="bf-sidebar-news-list" th:if="${recentNews != null and !recentNews.isEmpty()}">
                    <div th:each="item : ${recentNews}" class="bf-sidebar-news-item">
                        <a th:href="@{/news/{slug}(slug=${item.slug})}" class="bf-sidebar-news-link">
                            <div class="bf-sidebar-news-img">
                                <img th:if="${item.coverImage != null and item.coverImage != ''}"
                                     th:src="${item.coverImage}" th:alt="${item.title}" loading="lazy">
                                <div th:unless="${item.coverImage != null and item.coverImage != ''}" class="bf-sidebar-news-placeholder">
                                    <i class="bi bi-newspaper"></i>
                                </div>
                            </div>
                            <div class="bf-sidebar-news-info">
                                <span class="bf-sidebar-news-title" th:text="${item.title}">Title</span>
                                <span class="bf-sidebar-news-date" th:text="${#temporals.format(item.createdTime, 'yyyy/ MM-dd')}">2025/ 11-06</span>
                                <span class="bf-sidebar-news-comments">0 COMMENTS</span>
                            </div>
                        </a>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
