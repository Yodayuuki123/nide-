server:
  port: 8080
  servlet:
    context-path: /
spring:
  application:
    name: filter-website
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/web_site?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Philitee@Flt2026#Sec
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  security:
    user:
      name: admin
      password: admin123
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.philitee.filter.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
upload:
  base-path: /home/ubuntu/wp-content/uploads
  url-prefix: /wp-content/uploads
  static-web-path:
  proxy-enabled: true
  proxy-remote-host: https://filter.philitee.com
logging:
  level:
    com.philitee.filter: debug
