server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    context-path: /
    session:
      cookie:
        same-site: lax
        secure: false

spring:
  main:
    allow-circular-references: true
  application:
    name: filter-website

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/web_site?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000
    username: root
    password: Philitee@Flt2026#Sec
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.philitee.filter.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

upload:
  base-path: /root/filter-website/wp-content/uploads
  url-prefix: /wp-content/uploads
  static-web-path: /root/static_web/filter.philitee.com/wp-content/uploads
  legacy-wordpress-path: /opt/website/wordpress/wp-content/uploads
  proxy-enabled: false

logging:
  level:
    com.philitee.filter: info
