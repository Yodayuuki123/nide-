# ===== About =====
about.title=About Philitee
about.subtitle=Two decades of filtration expertise, trusted by industries worldwide
about.company.eyebrow=Our Story
about.company.title=Who We Are
about.company.desc=Founded in 2003 in Wenzhou, China, Philitee Filter began as a small filter bag workshop with a clear vision: to provide the highest quality filtration products at competitive factory-direct prices. Over two decades, we have grown into a comprehensive filtration solutions provider with our own needle punched felt production lines, weaving looms, and automated filter bag sewing facilities.
about.company.desc2=Today, our products serve industries across more than 100 countries and regions, including Europe, North America, Southeast Asia, the Middle East, and Africa. From cement plants and coal-fired power stations to steel mills and waste incineration facilities, Philitee filters are trusted wherever reliable dust collection and emission control are critical.
about.values.eyebrow=Why Choose Us
about.values.title=Our Advantages
about.value.quality=Premium Raw Materials
about.value.quality.desc=We source only first-grade fibers from certified suppliers. Every batch of filter media undergoes tensile strength, air permeability, and thermal shrinkage testing before production.
about.value.innovation=In-House R&D
about.value.innovation.desc=Our engineering team continuously develops advanced filtration materials including PTFE membrane lamination, anti-static treatments, and acid/alkali resistant coatings for extreme environments.
about.value.service=Technical Consulting
about.value.service.desc=Our engineers bring 20+ years of field experience. We provide free application analysis, filter media selection guidance, and customized solutions tailored to your specific operating conditions.
about.value.global=Global Logistics
about.value.global.desc=Strategically located near Wenzhou Port, we offer fast ocean freight to major ports worldwide. Standard orders ship within 7-15 working days with full export documentation support.
about.mission.eyebrow=Our Commitment
about.mission.title=Cleaner Air, Better Industry
about.mission.desc=We believe every factory deserves access to high-performance filtration that meets emission standards without breaking the budget. Our mission is to help industries worldwide achieve cleaner production through reliable, cost-effective filter technology. From material selection to after-sales support, we are with you at every step.

# ===== Factory =====
factory.title=Our Factory
factory.subtitle=Vertically Integrated Manufacturing from Raw Material to Finished Product
factory.overview.eyebrow=Manufacturing Excellence
factory.overview.title=Our Production Base
factory.overview.desc=Our vertically integrated manufacturing campus houses needle punched felt production, woven fabric weaving, filter bag cutting and sewing, and bag cage fabrication under one roof. This allows us to control quality at every stage and offer competitive pricing with fast lead times.
factory.stat.area=Factory Area
factory.stat.lines=Production Lines
factory.stat.employees=Skilled Workers
factory.stat.cert=Quality System
factory.process.eyebrow=Production Process
factory.process.title=How We Manufacture
factory.step1.title=Raw Material Inspection
factory.step1.desc=Every batch of fiber, yarn, and base fabric is inspected for weight, tensile strength, and chemical composition before entering the production line.
factory.step2.title=Felt & Fabric Production
factory.step2.desc=Advanced needle punching machines and air-jet looms produce filter media with precise weight, thickness, and air permeability specifications.
factory.step3.title=Cutting, Sewing & Treatment
factory.step3.desc=CNC cutting ensures dimensional accuracy. Automated sewing lines produce consistent seam quality. Surface treatments include PTFE lamination, singeing, and calendering.
factory.step4.title=QC Testing & Shipping
factory.step4.desc=Final products undergo 100% inspection for dimensions, weight, and appearance. Passed goods are professionally packed in PE bags and cartons for safe global delivery.
