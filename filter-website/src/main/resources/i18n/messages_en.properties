# Factory - Sewing Section
factory.sewing.eyebrow=Sewing & Assembly
factory.sewing.title=Filter Bag Production
factory.sewing.desc=Our automated sewing lines use proprietary heat-welding technology to produce filter bags with superior seam strength. CNC cutting ensures dimensional accuracy for every piece.
factory.sewing.point1=Automated CNC cutting for precise dimensions
factory.sewing.point2=Heat-welded seams for maximum durability
factory.sewing.point3=Multi-needle industrial sewing machines
factory.sewing.point4=Capacity: 100,000+ bags per month

# Factory - Needle Felt Section
factory.felt.eyebrow=Felt & Fabric
factory.felt.title=Needle Felt Production
factory.felt.desc=Advanced needle looms and air-jet weaving machines produce filter media with precise control of weight, thickness and air permeability. We handle every step from fiber opening to finished rolls.
factory.felt.point1=Needle punch felts: PPS, P84, PTFE, Aramid, Fiberglass
factory.felt.point2=Woven filter cloths for press filter applications
factory.felt.point3=Controlled weight, thickness and permeability
factory.felt.point4=Annual output: 10 million+ sqm of filter media

# Factory - Special Materials
factory.material.eyebrow=Raw Materials
factory.material.title=Special Material Processing
factory.material.desc=From acrylic and carbon fiber to PTFE membrane lamination, our facility processes a full range of filtration materials for different industrial applications and temperature requirements.
factory.material.point1=Acrylic fiber processing for moderate temperatures
factory.material.point2=Carbon-infused media for odor control
factory.material.point3=PTFE membrane lamination for fine particle capture
