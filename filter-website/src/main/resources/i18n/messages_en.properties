# ===== Factory =====
factory.title=Our Factory
factory.subtitle=Vertically Integrated Manufacturing from Raw Material to Finished Product
factory.overview.eyebrow=Manufacturing Excellence
factory.overview.title=Our Production Base
factory.overview.desc=Our vertically integrated manufacturing campus houses needle punched felt production, woven fabric weaving, filter bag cutting and sewing, and bag cage fabrication under one roof. This allows us to control quality at every stage and offer competitive pricing with fast lead times.
factory.stat.area=Factory Area
factory.stat.lines=Production Lines
factory.stat.employees=Skilled Workers
factory.stat.cert=Quality System
factory.process.eyebrow=Production Process
factory.process.title=How We Manufacture
factory.step1.title=Raw Material Inspection
factory.step1.desc=Every batch of fiber, yarn, and base fabric is inspected for weight, tensile strength, and chemical composition before entering the production line.
factory.step2.title=Felt & Fabric Production
factory.step2.desc=Advanced needle punching machines and air-jet looms produce filter media with precise weight, thickness, and air permeability specifications.
factory.step3.title=Cutting, Sewing & Treatment
factory.step3.desc=CNC cutting ensures dimensional accuracy. Automated sewing lines produce consistent seam quality. Surface treatments include PTFE lamination, singeing, and calendering.
factory.step4.title=QC Testing & Shipping
factory.step4.desc=Final products undergo 100% inspection for dimensions, weight, and appearance. Passed goods are professionally packed in PE bags and cartons for safe global delivery.
