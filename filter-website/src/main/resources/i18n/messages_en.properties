about.title=About Philite\u00ae
about.subtitle=First grade filter solutions, trusted by industries in 100+ countries
about.company.eyebrow=Our Story
about.company.title=Who We Are
about.company.desc=Philite\u00ae is committed to providing first grade filter solutions. After years of development, we have established close business relationships with our customers in more than 100 countries and regions in the world. The key to our rapid growth and development comes from our management's ethos of premium quality, innovation and being customer-focused. Our company is a leader in the filter material industry, and is one of the top 5 suppliers of air slide belts, filter bags and needle punched felt in Europe.
about.company.desc2=Philite\u00ae actively participates in the global supply chain service market, and we are committed to providing customers with high-quality products and services to promote local economic development. At the same time, we adhere to the concept of sustainable development and fulfill our environmental and social responsibilities.

# About - Core Advantages
about.values.eyebrow=Why Choose Us
about.values.title=Our Core Advantages
about.value.quality=Quality Assurance
about.value.quality.desc=We have established a strict quality management system. Every batch of products has passed through multiple inspection systems. At the same time, we invest a lot of money every year in the research and development of new filtration solutions to meet the new needs of customers.
about.value.innovation=Technical Support
about.value.innovation.desc=A lot of clients are confused about how to choose the right fabric and accessories, and feel helpless about lowering the cost of bag filtration. Philite\u00ae engineers, with 20 years of experience, can provide a series of consulting, support and advice. All these services are free.
about.value.service=Production Solution
about.value.service.desc=We developed two unique technological achievements to improve the efficiency of the filter bag sewing machine and hot welding machine in 4 long years. Now we are continuing to improve this service for our clients. The higher the efficiency, the lower the costs.
about.value.global=One-Stop Purchasing
about.value.global.desc=There are so many filtration products, a lot of our clients had troubles during purchasing. We can help you save the time \u2014 all you have to do is send us the detail of the products. Especially the filter bag accessories, we suggest you choosing our one-stop purchasing.

# About - Service Process
about.process.eyebrow=How We Work
about.process.title=Our Service Process
about.process.step1.title=Design Plan
about.process.step1.desc=We offer a design plan according to your demand of the production.
about.process.step2.title=Configuration Adjustment
about.process.step2.desc=Adjust the configuration until we can ensure the project on the basis of your production base's circumstance and special demands.
about.process.step3.title=Quotation & Final Design
about.process.step3.desc=We can offer a specific quotation and finish final design project through negotiation.
about.process.step4.title=Production
about.process.step4.desc=Starting production with strict quality control at every stage.
about.process.step5.title=Installation & Debugging
about.process.step5.desc=Our engineer will arrive at your production base and help install, debug and train employees when our equipment arrives.
about.process.step6.title=After-Sales Service
about.process.step6.desc=In addition to adequate warranty period, we have prepared quality supplies. Our sales engineers provide online assistance 24/7.

