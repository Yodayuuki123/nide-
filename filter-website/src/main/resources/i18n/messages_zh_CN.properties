service.title=我们的服务
service.subtitle=专业技术支持、生产解决方案与一站式采购服务
service.technical.eyebrow=技术支持
service.technical.title=专业技术支持
service.technical.text=很多客户对如何选择合适的滤料和配件感到困惑，对降低袋式过滤成本感到无助。Philite® 的工程师拥有20年经验，可提供一系列咨询、支持和建议。所有这些服务均免费提供。
service.production.eyebrow=效率优先
service.production.title=生产解决方案
service.production.text=作为制造商，您深知效率越高，成本越低。我们花了4年时间开发了两项独特的技术成果，提高了滤袋缝纫机和热焊机的效率。我们正在持续为客户改进这项服务。
service.onestop.eyebrow=便捷采购
service.onestop.title=一站式采购
service.onestop.text=过滤产品种类繁多，很多客户在采购时遇到困难。我们可以帮您节省时间——您只需将产品详情发送给我们即可。尤其是滤袋配件，我们建议您选择我们的一站式采购服务。
service.process.eyebrow=工作流程
service.process.title=服务流程
service.process.step1.title=设计方案
service.process.step1.desc=根据您的生产需求提供设计方案。
service.process.step2.title=配置调整
service.process.step2.desc=根据您生产基地的情况和特殊需求调整配置，直到确保项目可行。
service.process.step3.title=报价与终稿
service.process.step3.desc=通过协商提供具体报价并完成最终设计方案。
service.process.step4.title=生产制造
service.process.step4.desc=开始生产，每个阶段都有严格的质量控制。
service.process.step5.title=安装调试
service.process.step5.desc=设备到达后，我们的工程师将前往您的生产基地协助安装、调试并培训员工。
service.process.step6.title=售后服务
service.process.step6.desc=除充足的保修期外，我们还备有优质备件。我们的销售工程师提供7×24小时在线支持。

